<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления | Сервер Строителей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель навигации (шапка) -->
    <header class="main-header">
        <div class="logo">Мирополис <span class="logo-badge">PRO</span></div>
        <nav class="nav-links">
            <a href="moderation.html" class="moderation-link">Модерация</a>
        </nav>
        
        <!-- Новый блок профиля в шапке -->
        <div class="profile-container" id="profileMenuBtn">
            <div class="profile-avatar" id="headerAvatar">K</div>
            <span class="profile-name" id="headerUsername">Kranovschik</span>
            
            <!-- Выпадающее меню -->
            <div class="profile-dropdown" id="profileDropdown">
                <button id="openSettingsBtn">⚙️ Настройки</button>
                <button class="dropdown-logout" onclick="window.location.href='index.html'">🚪 Выйти</button>
            </div>
        </div>
    </header>

    <!-- Главный блок с контентом -->
    <main class="main-container">
        <div class="dashboard-wrapper" style="max-width: 450px;">
            <section class="welcome-banner">
                <h1>Добро пожаловать в Мирополис</h1>
                <p>Главная рабочая среда инженеров, архитекторов и строителей сервера.</p>
            </section>

            <div class="features-grid" style="grid-template-columns: 1fr;">
                <div class="feature-card">
                    <div class="card-icon">🗺️</div>
                    <h3>Города проекта</h3>
                    <p>Список всех построенных и планируемых городов на сервере Мирополис.</p>
                    <button class="card-btn" onclick="window.location.href='cities.html'">Смотреть города</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно настроек профиля -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header-box">
                <h2>Настройки профиля</h2>
                <button class="close-modal-btn" id="closeSettingsBtn">&times;</button>
            </div>
            
            <form id="profileSettingsForm" class="modal-form">
                <!-- Загрузка фото -->
                <div class="avatar-upload-box">
                    <div class="preview-avatar-large" id="modalAvatarPreview">K</div>
                    <label for="avatarInput" class="upload-label">Выбрать фото</label>
                    <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                </div>

                <div class="modal-input-group">
                    <label for="editUsername">Имя пользователя</label>
                    <input type="text" id="editUsername" required>
                </div>
                <div class="modal-input-group">
                    <label for="editPassword">Новый пароль</label>
                    <input type="password" id="editPassword" required>
                </div>
                <button type="submit" class="add-worker-btn">Сохранить изменения</button>
                <p id="settingsStatusMsg" class="mod-status-msg"></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
