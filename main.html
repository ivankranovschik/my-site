<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления | Сервер Строителей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель навигации (шапка) -->
    <header class="main-header">
        <div class="logo">Мирополис <span class="logo-badge">PRO</span></div>
        
        <!-- Красивые градиентные вкладки -->
        <nav class="nav-links">
            <a href="rules.html" class="rules-link">Правила</a>
            <a href="moderation.html" class="moderation-link">Модерация</a>
        </nav>
        
        <!-- Кнопка профиля -->
        <div class="profile-container" id="profileMenuBtn">
            <div class="profile-avatar" id="headerAvatar">K</div>
            <span class="profile-name" id="headerUsername">Kranovschik</span>
        </div>
    </header>

    <!-- Главный блок с контентом -->
    <main class="main-container">
        <div class="dashboard-wrapper" style="max-width: 450px;">
            <section class="welcome-banner">
                <h1>Добро пожаловать в Мирополис</h1>
                <p>Главная рабочая среда инженеров, архитекторов и строителей сервера.</p>
            </section>

            <!-- Карточка Городов -->
            <div class="features-grid" style="grid-template-columns: 1fr;">
                <div class="feature-card">
                    <div class="card-icon">🗺️</div>
                    <h3>Города проекта</h3>
                    <p>Список всех построенных и планируемых городов на сервере Мирополис.</p>
                    <button class="card-btn" onclick="window.location.href='cities.html'">Смотреть города</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Выпадающее меню профиля -->
    <div class="profile-dropdown" id="profileDropdown">
        <div class="dropdown-header">
            <div class="dropdown-avatar" id="dropdownAvatar">K</div>
            <div>
                <h4 id="dropdownUsername">Kranovschik</h4>
                <p>Строитель сервера</p>
            </div>
        </div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-body">
            <div class="dropdown-item">
                <label>Аватарка:</label>
                <input type="file" id="avatarUpload" accept="image/*">
            </div>
            <div class="dropdown-item">
                <label>Новое имя:</label>
                <input type="text" id="changeUsername" placeholder="Изменить ник">
            </div>
            <div class="dropdown-item">
                <label>Новый пароль:</label>
                <input type="password" id="changePassword" placeholder="Новый пароль">
            </div>
            <button class="save-profile-btn" id="saveProfileBtn">Сохранить</button>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-logout-btn" id="logoutBtn">Выйти из системы</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
