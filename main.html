<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления | Сервер Строителей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель навигации (шапка) -->
    <header class="main-header">
        <div class="logo">Мирополис <span class="logo-badge">PRO</span></div>
        <nav class="nav-links">
            <!-- Новая градиентная вкладка Правила -->
            <a href="rules.html" class="nav-gradient-btn rules-link">Правила</a>
            <a href="moderation.html" class="nav-gradient-btn moderation-link">Модерация</a>
        </nav>
        
        <!-- Кнопка профиля -->
        <div class="profile-menu-container">
            <button class="profile-btn" id="profileToggleBtn">
                <div class="profile-avatar" id="headerAvatar">K</div>
                <span class="profile-name" id="headerUsername">Kranovschik</span>
            </button>
            
            <!-- Выпадающее меню профиля -->
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-header">
                    <p class="dropdown-user-name" id="dropdownUsername">Kranovschik</p>
                    <p class="dropdown-user-role">Строитель сервера</p>
                </div>
                <hr class="dropdown-divider">
                <div class="dropdown-body">
                    <div class="dropdown-input-group">
                        <label>Сменить имя</label>
                        <input type="text" id="editUsername" placeholder="Новое имя">
                    </div>
                    <div class="dropdown-input-group">
                        <label>Сменить пароль</label>
                        <input type="password" id="editPassword" placeholder="Новый пароль">
                    </div>
                    <div class="dropdown-input-group">
                        <label>Аватарка (ссылка на фото)</label>
                        <input type="text" id="editAvatarUrl" placeholder="https://example.com">
                    </div>
                    <button class="save-profile-btn" id="saveProfileBtn">Сохранить</button>
                </div>
                <hr class="dropdown-divider">
                <button class="dropdown-logout-btn" onclick="logoutUser()">Выйти из аккаунта</button>
            </div>
        </div>
    </header>

    <!-- Главный блок с контентом -->
    <main class="main-container">
        <div class="dashboard-wrapper" style="max-width: 450px;">
            <section class="welcome-banner">
                <h1>Добро пожаловать в Мирополис</h1>
                <p>Главная рабочая среда инженеров, архитекторов и строителей сервера.</p>
            </section>

            <div class="features-grid" style="grid-template-columns: 1fr;">
                <div class="feature-card">
                    <div class="card-icon">🗺️</div>
                    <h3>Города проекта</h3>
                    <p>Список всех построенных и планируемых городов на сервере Мирополис.</p>
                    <button class="card-btn" onclick="window.location.href='cities.html'">Смотреть города</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
