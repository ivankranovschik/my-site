<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления | Сервер Строителей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель навигации (шапка) -->
    <header class="main-header">
        <div class="logo">Мирополис <span class="logo-badge">PRO</span></div>
        <nav class="nav-links">
            <a href="rules.html" class="rules-link">Правила</a>
            <a href="moderation.html" class="moderation-link">Модерация</a>
        </nav>
        
        <!-- Интерактивный блок профиля -->
        <div class="profile-menu-container">
            <div class="user-profile-block" id="profileTrigger">
                <div class="user-avatar" id="headerAvatar">K</div>
                <span class="user-name" id="headerUsername">Kranovschik</span>
            </div>

            <!-- Выпадающее меню настроек -->
            <div class="profile-dropdown" id="profileDropdown">
                <h3>Настройки профиля</h3>
                
                <div class="dropdown-group">
                    <label>Сменить аватарку</label>
                    <input type="file" id="avatarInput" accept="image/*">
                </div>

                <div class="dropdown-group">
                    <label>Новое имя</label>
                    <input type="text" id="changeNameInput" placeholder="Новый никнейм">
                </div>

                <div class="dropdown-group">
                    <label>Новый пароль</label>
                    <input type="password" id="changePassInput" placeholder="Новый пароль">
                </div>

                <button class="save-profile-btn" id="saveProfileBtn">Сохранить</button>
                
                <hr class="dropdown-divider">
                
                <!-- Возвращённая кнопка выхода -->
                <button class="dropdown-logout-btn" id="logoutBtn">
                    <span>Выйти из аккаунта</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Главный блок с контентом -->
    <main class="main-container">
        <div class="dashboard-wrapper" style="max-width: 450px;">
            <section class="welcome-banner">
                <h1>Добро пожаловать в Мирополис</h1>
                <p>Главная рабочая среда инженеров, архитекторов и строителей сервера.</p>
            </section>

            <div class="features-grid" style="grid-template-columns: 1fr;">
                <div class="feature-card">
                    <div class="card-icon">🗺️</div>
                    <h3>Города проекта</h3>
                    <p>Список всех построенных и планируемых городов на сервере Мирополис.</p>
                    <button class="card-btn" onclick="window.location.href='cities.html'">Смотреть города</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
