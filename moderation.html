<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Модерации | Сервер Строителей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель -->
    <header class="main-header">
        <div class="logo">Мирополис <span class="logo-badge">MODERATION</span></div>
        <nav class="nav-links">
            <a href="main.html" class="back-link">← Вернуться в меню</a>
        </nav>
        <button class="logout-btn" onclick="window.location.href='index.html'">Выйти</button>
    </header>

    <!-- Основной контент страницы модерации -->
    <main class="main-container">
        <div class="mod-page-wrapper">
            
            <!-- Левая колонка: Форма добавления -->
            <section class="mod-section">
                <h2>Добавить участника</h2>
                <p class="section-desc">Зарегистрируйте нового строителя в системе Мирополиса.</p>
                
                <form id="addWorkerForm" class="mod-page-form">
                    <div class="modal-input-group">
                        <label for="newUsername">Имя пользователя строителя</label>
                        <input type="text" id="newUsername" placeholder="Например: Builder_Alex" required>
                    </div>
                    <div class="modal-input-group">
                        <label for="newPassword">Пароль строителя</label>
                        <input type="password" id="newPassword" placeholder="Придумайте пароль" required>
                    </div>
                    <button type="submit" class="add-worker-btn">Добавить участника</button>
                    <p id="modSystemMessage" class="mod-status-msg"></p>
                </form>
            </section>

            <!-- Правая колонка: Список зарегистрированных (для расширения в будущем) -->
            <section class="mod-section">
                <h2>Список строителей</h2>
                <p class="section-desc">Все пользователи, имеющие доступ к панели управления.</p>
                
                <div class="workers-list-wrapper">
                    <div class="worker-item system-account">
                        <div class="worker-info">
                            <span class="worker-name">Kranovschik</span>
                            <span class="worker-role">Главный админ</span>
                        </div>
                        <span class="system-badge">Защищено</span>
                    </div>
                    <!-- Сюда скрипт будет выводить добавленных людей -->
                    <div id="dynamicWorkersList"></div>
                </div>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
