<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Upgrader Web</title>
    <style>
        body { background: #0e1015; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #181b23; border: 1px solid #282c37; padding: 30px; border-radius: 16px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .balance { font-size: 24px; font-weight: bold; color: #00ff88; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0e1015; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 14px; background: #ff4757; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button:hover { background: #ff6b81; }
        .result { margin-top: 20px; font-size: 14px; min-height: 40px; }
        .win { color: #00ff88; }
        .lose { color: #ff4757; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎰 АПГРЕЙДЕР</h2>
        <div class="balance">Баланс: <span id="bal">...</span> ₽</div>
        
        <input type="number" id="bet" placeholder="Ставка (₽)" value="10">
        <input type="number" id="mult" placeholder="Множитель (напр. 2)" value="2" step="0.1">
        
        <button onclick="makeUpgrade()">АПГРЕЙД</button>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        async function loadBalance() {
            const res = await fetch('/api/balance');
            const data = await res.json();
            document.getElementById('bal').innerText = data.balance.toFixed(2);
        }

        async function makeUpgrade() {
            const bet = document.getElementById('bet').value;
            const multiplier = document.getElementById('mult').value;
            const resDiv = document.getElementById('result');
            
            resDiv.innerText = "Крутим...";

            const res = await fetch('/api/upgrade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ bet, multiplier })
            });

            const data = await res.json();
            if (!res.ok) {
                resDiv.innerHTML = `<span class="lose">${data.error}</span>`;
                return;
            }

            document.getElementById('bal').innerText = data.new_balance.toFixed(2);
            if (data.success) {
                resDiv.innerHTML = `<span class="win">🎉 ВЫИГРЫШ: +${data.payout} ₽!<br>(Шанс: ${data.chance}% | Выпало: ${data.roll})</span>`;
            } else {
                resDiv.innerHTML = `<span class="lose">💥 СГОРЕЛО!<br>(Шанс: ${data.chance}% | Выпало: ${data.roll})</span>`;
            }
        }

        loadBalance();
    </script>
</body>
</html>
