```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | Мирополис</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e293b,#0f172a);
}

.login-box{
    width:380px;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#f59e0b;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#f59e0b;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#d97706;
}

#error{
    margin-top:15px;
    text-align:center;
    color:red;
}
</style>
</head>
<body>

<div class="login-box">

    <h1>🏗 Мирополис</h1>
    <p>Вход в систему строителей</p>

    <input type="text" id="login" placeholder="Имя пользователя">
    <input type="password" id="password" placeholder="Пароль">

    <button onclick="enter()">Войти</button>

    <div id="error"></div>

</div>

<script>
function enter(){

    const login = document.getElementById("login").value;
    const password = document.getElementById("password").value;

    if(login === "admin" && password === "12345"){
        window.location.href = "index.html";
    }else{
        document.getElementById("error").innerText =
        "Неверный логин или пароль";
    }
}
</script>

</body>
</html>
```
