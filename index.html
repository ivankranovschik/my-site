<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный дневник</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="diary-header">
        <button id="btn-schedule" class="nav-btn active">📅 Расписание</button>
        <button id="btn-grades" class="nav-btn">📊 Оценки</button>
    </header>

    <main class="content-container">
        <section id="section-schedule" class="content-section active">
            <div id="schedule-grid" class="schedule-grid"></div>
        </section>

        <section id="section-grades" class="content-section">
            <p style="text-align:center; color:#666; margin-top:50px;">Раздел оценок в разработке.</p>
        </section>
    </main>

    <script>
        const subjects = ["Математика", "Русский язык", "Литература", "История", "Физика", "Химия", "Биология", "География", "Английский язык", "Физкультура", "Информатика"];
        const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница"];
        const grid = document.getElementById("schedule-grid");

        days.forEach(day => {
            const dayCard = document.createElement("div");
            dayCard.className = "day-card";
            
            const dayTitle = document.createElement("h3");
            dayTitle.innerText = day;
            dayCard.appendChild(dayTitle);

            const list = document.createElement("ol");
            const lessonsCount = Math.floor(Math.random() * 2) + 6; // 6 или 7 уроков

            for (let i = 0; i < lessonsCount; i++) {
                const li = document.createElement("li");
                const randomSubject = subjects[Math.floor(Math.random() * subjects.length)];
                
                // Создаем структуру ячеек (Номер, Предмет, ДЗ, Оценка)
                li.innerHTML = `
                    <div class="lesson-number">${i}</div>
                    <div class="subject-name">${randomSubject}</div>
                    <div class="homework-text">не задано</div>
                    <div class="grade-value"></div>
                `;
                list.appendChild(li);
            }

            dayCard.appendChild(list);
            grid.appendChild(dayCard);
        });

        // Логика кнопок
        const btnSchedule = document.getElementById("btn-schedule");
        const btnGrades = document.getElementById("btn-grades");
        const secSchedule = document.getElementById("section-schedule");
        const secGrades = document.getElementById("section-grades");

        btnSchedule.addEventListener("click", () => {
            btnSchedule.classList.add("active"); btnGrades.classList.remove("active");
            secSchedule.classList.add("active"); secGrades.classList.remove("active");
        });
        btnGrades.addEventListener("click", () => {
            btnGrades.classList.add("active"); btnSchedule.classList.remove("active");
            secGrades.classList.add("active"); secSchedule.classList.remove("active");
        });
    </script>
</body>
</html>
