<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Дневник</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ОКНО ВХОДА -->
    <div id="login-screen" class="container auth-box">
        <h2>Вход в дневник</h2>
        <div class="input-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" placeholder="Введите имя...">
        </div>
        <div class="input-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль...">
        </div>
        <button onclick="handleLogin()">Войти</button>
        <p id="login-error" class="error-msg"></p>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН ДНЕВНИКА (по умолчанию скрыт) -->
    <div id="main-screen" class="container main-box hidden">
        <header>
            <h1>Панель управления: <span id="user-display"></span></h1>
            <button onclick="handleLogout()" class="btn-logout">Выйти</button>
        </header>

        <!-- Переключатель вкладок -->
        <nav class="tabs">
            <button id="tab-schedule-btn" class="tab-btn active" onclick="switchTab('schedule')">Расписание</button>
            <button id="tab-grades-btn" class="tab-btn" onclick="switchTab('grades')">Оценки</button>
        </nav>

        <!-- Вкладка: Расписание -->
        <section id="tab-schedule" class="tab-content">
            <h3>Расписание уроков</h3>
            <div id="schedule-container">
                <!-- Сюда JavaScript добавит дни недели -->
            </div>
        </section>

        <!-- Вкладка: Оценки -->
        <section id="tab-grades" class="tab-content hidden">
            <h3>Выставление оценок</h3>
            <div class="grade-form">
                <select id="subject-select">
                    <option value="Математика">Математика</option>
                    <option value="Русский язык">Русский язык</option>
                    <option value="Литература">Литература</option>
                    <option value="История">История</option>
                    <option value="Физика">Физика</option>
                </select>
                <select id="grade-select">
                    <option value="5">5</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                </select>
                <button onclick="addGrade()">Поставить оценку</button>
            </div>
            <ul id="grades-list">
                <!-- Сюда JavaScript будет добавлять оценки -->
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
