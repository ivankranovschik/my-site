<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | СтройКонтроль</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="background-decor"></div>
    
    <div class="login-container">
        <form class="login-form">
            <h2>Авторизация</h2>
            <p class="subtitle">Управление строительными объектами</p>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Логин" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль" required>
            </div>

            <button type="button" class="login-btn" onclick="checkLogin()">Войти в систему</button>
            
            <div id="user-info" class="user-card hidden">
                <div class="divider"></div>
                <p><strong>Имя:</strong> <span id="display-name"></span></p>
                <p><strong>Звание:</strong> <span id="display-rank"></span></p>
                <div class="status-badge">Доступ разрешен</div>
            </div>
        </form>
    </div>

    <script>
        function checkLogin() {
            const login = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const infoBox = document.getElementById('user-info');

            if(login === 'admin' && pass === '12345') {
                document.getElementById('display-name').innerText = 'Иван Прораб';
                document.getElementById('display-rank').innerText = 'Главный инженер';
                infoBox.classList.remove('hidden');
                infoBox.style.animation = 'fadeIn 0.5s forwards';
            } else {
                alert('Неверный логин или пароль!');
            }
        }
    </script>
</body>
</html>
