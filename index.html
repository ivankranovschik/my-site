```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мирополис | Вход</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(15,23,42,0.55),
        rgba(15,23,42,0.55)
    ),
    url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1920&q=80");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:linear-gradient(
        135deg,
        rgba(59,130,246,.25),
        rgba(139,92,246,.25),
        rgba(236,72,153,.15)
    );

    background-size:300% 300%;
    animation:gradientMove 10s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.login-box{
    position:relative;
    z-index:2;

    width:450px;
    padding:40px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.2);
    border-radius:24px;

    box-shadow:0 25px 60px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    color:white;
    font-size:48px;
    margin-bottom:8px;
}

.logo p{
    color:#e2e8f0;
    font-size:17px;
}

label{
    display:block;
    color:white;
    margin-bottom:8px;
    margin-top:18px;
    font-weight:600;
}

input{
    width:100%;
    padding:15px;

    border:none;
    border-radius:12px;

    background:rgba(255,255,255,.15);

    color:white;
    font-size:16px;
}

input::placeholder{
    color:#d1d5db;
}

input:focus{
    outline:none;
    background:rgba(255,255,255,.22);
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;

    border:none;
    border-radius:12px;

    background:linear-gradient(
        90deg,
        #2563eb,
        #7c3aed
    );

    color:white;
    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#cbd5e1;
}

</style>
</head>
<body>

<div class="login-box">

    <div class="logo">
        <h1>🏙 Мирополис</h1>
        <p>Панель управления строителей</p>
    </div>

    <label>Имя пользователя</label>
    <input type="text" placeholder="Введите имя пользователя">

    <label>Пароль</label>
    <input type="password" placeholder="Введите пароль">

    <button>
        Войти
    </button>

    <div class="footer">
        Мирополис © 2026
    </div>

</div>

</body>
</html>
```
