<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мирополис | Система управления</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --prm: #ff00cc;
            --sec: #3333ff;
            --acc: #00ffff;
            --glass: rgba(255, 255, 255, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .bg-gradient {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, #1a1a2e, #050505);
            z-index: -2;
        }

        .orb {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; z-index: -1;
            animation: move 15s infinite alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--prm); top: -10%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; background: var(--sec); bottom: -5%; right: -5%; }

        @keyframes move { from { transform: translate(0,0); } to { transform: translate(50px, 50px); } }

        /* ФОРМА ВХОДА */
        .glass-box {
            position: relative; width: 400px; background: var(--glass);
            backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: 0.5s;
        }
        h1 { font-family: 'Orbitron'; font-size: 24px; text-align: center; margin-bottom: 30px; }
        h1 span { background: linear-gradient(to right, var(--prm), var(--acc)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .field { position: relative; margin-bottom: 15px; }
        .field input {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; outline: none;
        }
        .field label { position: absolute; left: 15px; top: 13px; font-size: 10px; color: #666; transition: 0.3s; pointer-events: none; }
        .field input:focus ~ label, .field input:not(:placeholder-shown) ~ label { top: -8px; left: 10px; color: var(--acc); font-size: 9px; background: #08080a; padding: 0 5px; }
        
        .auth-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(45deg, var(--prm), var(--sec)); color: #fff; font-family: 'Orbitron'; cursor: pointer; font-weight: 700; margin-top: 10px; transition: 0.3s; }
        .auth-btn:hover { box-shadow: 0 0 20px var(--prm); transform: translateY(-2px); }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-nav {
            position: fixed; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 15px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            padding: 8px 15px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .user-trigger { display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.3s; }
        .mini-avatar { width: 35px; height: 35px; background: linear-gradient(45deg, var(--prm), var(--sec)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-family: 'Orbitron'; font-size: 14px; }
        .user-info-text h4 { font-size: 13px; font-family: 'Orbitron'; color: var(--acc); }
        .user-info-text p { font-size: 9px; color: #aaa; text-transform: uppercase; }

        /* МЕНЮ */
        .menu-grid { display: grid; grid-template-columns: repeat(2, 220px); gap: 20px; z-index: 10; }
        .menu-item {
            background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; border-radius: 24px; text-align: center; cursor: pointer; transition: 0.4s ease;
        }
        .menu-item:hover { transform: translateY(-10px); border-color: var(--prm); box-shadow: 0 15px 30px rgba(255,0,204,0.2); }
        .menu-item .icon { font-size: 40px; margin-bottom: 15px; display: block; }
        .menu-item h3 { font-family: 'Orbitron'; font-size: 14px; letter-spacing: 2px; background: linear-gradient(to right, #fff, var(--acc)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* МОДАЛКА */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .profile-card {
            background: linear-gradient(135deg, #1a1a2e, #0a0a0a);
            padding: 40px; border-radius: 30px; border: 1px solid var(--prm);
            text-align: center; width: 320px; position: relative;
        }
        .big-avatar { width: 100px; height: 100px; background: linear-gradient(45deg, var(--prm), var(--sec)); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-family: 'Orbitron'; box-shadow: 0 0 30px var(--prm); }
        
        .hidden { display: none !important; }
        .fade-out { opacity: 0; transform: scale(0.9); }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="login-container" class="glass-box">
        <h1>ВХОД<span> НА САЙТ</span></h1>
        <div class="field"><input type="text" id="reg-name" placeholder=" " required><label>ИМЯ ПОЛЬЗОВАТЕЛЯ</label></div>
        <div class="field"><input type="text" id="reg-login" placeholder=" " required><label>ЛОГИН</label></div>
        <div class="field"><input type="text" id="reg-rank" placeholder=" " required><label>ЗВАНИЕ</label></div>
        <div class="field"><input type="password" id="reg-pass" placeholder=" " required><label>ПАРОЛЬ</label></div>
        <button type="button" class="auth-btn" onclick="validateUser()">ПОДТВЕРДИТЬ</button>
    </div>

    <div id="dashboard" class="hidden">
        <nav class="top-nav">
            <div class="user-trigger" onclick="toggleProfile()">
                <div class="mini-avatar">K</div>
                <div class="user-info-text">
                    <h4 id="nav-name"></h4>
                    <p id="nav-rank"></p>
                </div>
            </div>
            <button onclick="location.reload()" style="background:none; border:none; color:var(--prm); cursor:pointer; font-family:'Orbitron'; font-size:9px;">ВЫХОД</button>
        </nav>

        <div class="menu-grid">
            <div class="menu-item"><span class="icon">🏗️</span><h3>ОБЪЕКТЫ</h3></div>
            <div class="menu-item"><span class="icon">👥</span><h3>КОМАНДА</h3></div>
            <div class="menu-item"><span class="icon">📁</span><h3>ЧЕРТЕЖИ</h3></div>
            <div class="menu-item"><span class="icon">⚙️</span><h3>СИСТЕМА</h3></div>
        </div>
    </div>

    <div id="profile-modal" class="modal hidden">
        <div class="profile-card">
            <span onclick="toggleProfile()" style="position:absolute; top:20px; right:20px; cursor:pointer;">×</span>
            <div class="big-avatar">K</div>
            <h2 id="prof-name" style="font-family:'Orbitron'; margin-bottom:10px;"></h2>
            <p id="prof-rank" style="color:var(--acc); font-weight:700;"></p>
        </div>
    </div>

    <script>
        function validateUser() {
            const name = document.getElementById('reg-name').value;
            const login = document.getElementById('reg-login').value;
            const rank = document.getElementById('reg-rank').value;
            const pass = document.getElementById('reg-pass').value;

            if(name === 'Kranovschik' && login === 'Creator' && rank === 'Создатель' && pass === '12345') {
                document.getElementById('login-container').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('login-container').style.display = 'none';
                    document.getElementById('dashboard').classList.remove('hidden');
                    document.getElementById('dashboard').style.display = 'flex';
                    document.getElementById('nav-name').innerText = name;
                    document.getElementById('nav-rank').innerText = rank;
                    document.getElementById('prof-name').innerText = name;
                    document.getElementById('prof-rank').innerText = rank;
                }, 500);
            } else { alert('ДОСТУП ЗАПРЕЩЕН'); }
        }

        function toggleProfile() {
            document.getElementById('profile-modal').classList.toggle('hidden');
        }
    </script>
</body>
</html>
