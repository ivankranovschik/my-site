<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор лифта ЩЛЗ 2011 (16 этажей)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="simulator">
        <!-- Шахта лифта -->
        <div class="shaft">
            <div class="elevator" id="elevator">
                <div class="doors" id="doors">
                    <div class="door left-door"></div>
                    <div class="door right-door"></div>
                </div>
            </div>
        </div>

        <!-- Панель управления ЩЛЗ внутри кабины -->
        <div class="panel">
            <div class="brand">ЩЛЗ 2011</div>
            <!-- Электронное табло -->
            <div class="display" id="display">1</div>
            
            <!-- Сетка кнопок 1-16 -->
            <div class="buttons-grid" id="buttonsGrid"></div>
            
            <!-- Служебные кнопки -->
            <div class="service-buttons">
                <button class="btn service" id="btn-open">◄►</button>
                <button class="btn service" id="btn-close">►◄</button>
                <button class="btn service alarm" id="btn-alarm">🔔</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
