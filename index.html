<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лифтёр</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Симулятор лифтёра</h1>

<p id="power">Сеть: ВКЛ</p>
<button onclick="togglePower()">Вкл/Выкл питание</button>

<hr>

<h2>Этаж 1</h2>

<div id="floorDisplay">1</div>

<button id="callButton" onclick="callLift()"></button>

<br><br>

<div id="liftShaft">

    <div id="lift">

        <div id="doorLeft"></div>
        <div id="doorRight"></div>

        <div id="insidePanel">

            <div id="cabinDisplay">1</div>

            <h3>Панель лифта</h3>

            <button onclick="goToFloor(1)">1</button>
            <button onclick="goToFloor(2)">2</button>
            <button onclick="goToFloor(3)">3</button>
            <button onclick="goToFloor(4)">4</button>
            <button onclick="goToFloor(5)">5</button>

        </div>

    </div>

</div>

<p id="status">Лифт на 1 этаже</p>

<button onclick="enterLift()">Войти в лифт</button>
<button onclick="exitLift()">Выйти из лифта</button>

<script src="script.js"></script>

</body>
</html>
