```html
<!DOCTYPE html>

<head>

<title>Мирополис | Вход</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(15,23,42,0.55),

    background-size:cover;
    background-position:center;
}

.login-box{
    width:450px;

    padding:40px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    border-radius:24px;

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    color:white;
    font-size:48px;
}

.logo p{
    color:#d1d5db;
    margin-top:8px;
}

label{
    display:block;
    color:white;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;

    border:none;
    border-radius:12px;

    background:rgba(255,255,255,0.15);

    color:white;
    font-size:16px;
}

input::placeholder{
    color:#d1d5db;
}

button{
    width:100%;
    margin-top:25px;

    padding:15px;

    border:none;
    border-radius:12px;

    background:#2563eb;

    color:white;

}

.footer{

    margin-top:20px;

</style>
</head>

<body>

    <label>Пароль</label>

    </div>
