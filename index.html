<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-TIER SYSTEM | ADMIN PANEL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="glow-sphere"></div>
    <div class="glow-sphere-2"></div>

    <div class="glass-box">
        <div class="status-bar">SYSTEM ONLINE</div>
        
        <div id="login-section">
            <h1>CONTROL<span>PANEL</span></h1>
            <p class="brand">IVANKRANOVSCHIK ENTERPRISE</p>

            <div class="field">
                <input type="text" id="user-login" placeholder=" " required>
                <label>ЛОГИН</label>
            </div>

            <div class="field">
                <input type="password" id="user-pass" placeholder=" " required>
                <label>ПАРОЛЬ</label>
            </div>

            <button type="button" class="auth-btn" onclick="initLogin()">
                ВЫПОЛНИТЬ ВХОД
            </button>
        </div>

        <!-- Карточка Создателя -->
        <div id="creator-profile" class="profile-layout hidden">
            <div class="avatar-ring">
                <div class="avatar-core">K</div>
            </div>
            <div class="details">
                <h2 id="res-user"></h2>
                <p class="rank-label">СТАТУС: <span id="res-rank"></span></p>
                <div class="energy-bar">
                    <div class="energy-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function initLogin() {
            const loginInput = document.getElementById('user-login').value;
            const passInput = document.getElementById('user-pass').value;
            const loginSection = document.getElementById('login-section');
            const profileSection = document.getElementById('creator-profile');

            if(loginInput === 'Creator' && passInput === '12345') {
                document.getElementById('res-user').innerText = 'Kranovschik';
                document.getElementById('res-rank').innerText = 'Создатель';
                
                loginSection.classList.add('fade-out');
                setTimeout(() => {
                    loginSection.style.display = 'none';
                    profileSection.classList.remove('hidden');
                    profileSection.classList.add('fade-in');
                }, 500);
            } else {
                alert('ДОСТУП ЗАПРЕЩЕН: Неверные учетные данные');
            }
        }
    </script>
</body>
</html>
