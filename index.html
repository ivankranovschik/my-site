<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дневник Игрового Сервера</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #16213e; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #4ecca3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #0f3460; padding: 12px; text-align: left; }
        th { background: #0f3460; color: #4ecca3; }
        tr:nth-child(even) { background: #1b262c; }
        .grade { font-weight: bold; color: #e94560; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Журнал Игрового Сервера</h1>
        <table>
            <tr>
                <th>Предмет / Навык</th>
                <th>Оценка</th>
                <th>Домашнее задание</th>
            </tr>
            <!-- Сюда добавляй новые строки -->
            <tr>
                <td>Стрельба (PvP)</td>
                <td class="grade">4/5</td>
                <td>Тренировка на Aim-карте 30 мин</td>
            </tr>
            <tr>
                <td>Командная работа</td>
                <td class="grade">3/5</td>
                <td>Изучить тактику "Сплит А" на Dust2</td>
            </tr>
        </table>
    </div>
</body>
</html>
