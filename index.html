<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мирополис | Система управления</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- БЛОК ВХОДА -->
    <div id="login-container" class="glass-box">
        <div class="glow-border"></div>
        <div id="login-section">
            <h1>ВХОД<span> НА САЙТ</span></h1>
            <p class="brand">САЙТ ДЛЯ КОМАНДЫ МИРОПОЛИСА</p>

            <div class="field">
                <input type="text" id="reg-name" placeholder=" " required>
                <label>ИМЯ ПОЛЬЗОВАТЕЛЯ</label>
            </div>
            <div class="field">
                <input type="text" id="reg-login" placeholder=" " required>
                <label>ЛОГИН</label>
            </div>
            <div class="field">
                <input type="text" id="reg-rank" placeholder=" " required>
                <label>ЗВАНИЕ</label>
            </div>
            <div class="field">
                <input type="password" id="reg-pass" placeholder=" " required>
                <label>ПАРОЛЬ</label>
            </div>

            <button type="button" class="auth-btn" onclick="validateUser()">ПОДТВЕРДИТЬ ЛИЧНОСТЬ</button>
        </div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ (скрыто по умолчанию) -->
    <div id="main-menu" class="menu-container hidden">
        <header class="menu-header">
            <div class="user-profile">
                <div class="mini-avatar">K</div>
                <div>
                    <h2 id="user-display-name">Kranovschik</h2>
                    <p id="user-display-rank">Создатель</p>
                </div>
            </div>
            <button class="logout-btn" onclick="location.reload()">ВЫХОД</button>
        </header>

        <div class="menu-grid">
            <div class="menu-item">
                <div class="icon">🏗️</div>
                <h3>ОБЪЕКТЫ</h3>
                <p>Текущие стройки</p>
            </div>
            <div class="menu-item">
                <div class="icon">👥</div>
                <h3>КОМАНДА</h3>
                <p>Состав Мирополиса</p>
            </div>
            <div class="menu-item">
                <div class="icon">📁</div>
                <h3>ЧЕРТЕЖИ</h3>
                <p>Архив проектов</p>
            </div>
            <div class="menu-item">
                <div class="icon">⚙️</div>
                <h3>НАСТРОЙКИ</h3>
                <p>Параметры системы</p>
            </div>
        </div>
    </div>

    <script>
        function validateUser() {
            const name = document.getElementById('reg-name').value;
            const login = document.getElementById('reg-login').value;
            const rank = document.getElementById('reg-rank').value;
            const pass = document.getElementById('reg-pass').value;

            if(name === 'Kranovschik' && login === 'Creator' && rank === 'Создатель' && pass === '12345') {
                document.getElementById('login-container').classList.add('fade-out');
                
                setTimeout(() => {
                    document.getElementById('login-container').style.display = 'none';
                    const menu = document.getElementById('main-menu');
                    menu.classList.remove('hidden');
                    menu.classList.add('fade-in');
                }, 500);
            } else {
                alert('ДОСТУП ЗАПРЕЩЕН');
            }
        }
    </script>
</body>
</html>
