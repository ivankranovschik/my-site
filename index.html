<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный дневник</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 800px;
        }
        h1, h2 { color: #333; }
        
        /* Стили для вкладок (меню) */
        .tabs-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            background-color: #e4e6eb;
            color: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background-color: #d8dadf; }
        /* Стиль для активной (нажатой) вкладки */
        .tab-btn.active {
            background-color: #007bff;
            color: white;
        }

        /* Стили для контента вкладок */
        .tab-content {
            display: none; /* По умолчанию скрываем все вкладки */
        }
        .tab-content.active {
            display: block; /* Показываем только активную вкладку */
        }

        /* Стили для формы дневника */
        .form-group {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr auto;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background-color: #f8f9fa; color: #555; }
        tr:hover { background-color: #f1f1f1; }
        .delete-btn {
            background-color: #dc3545;
            padding: 6px 12px;
            font-size: 12px;
        }
        .delete-btn:hover { background-color: #bd2130; }
        
        /* Временная заглушка для пустых вкладок */
        .placeholder-text {
            color: #777;
            font-style: italic;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Навигационное меню (Вкладки) -->
    <div class="tabs-menu">
        <button class="tab-btn active" onclick="switchTab('diaryTab', this)">📘 Дневник</button>
        <button class="tab-btn" onclick="switchTab('scheduleTab', this)">📅 Расписание</button>
        <button class="tab-btn" onclick="switchTab('gradesTab', this)">📊 Оценки</button>
    </div>

    <!-- ВКЛАДКА 1: ДНЕВНИК (Уже работает) -->
    <div id="diaryTab" class="tab-content active">
        <h1>Панель управления дневником</h1>
        <div class="form-group">
            <input type="text" id="nameInput" placeholder="ФИО ученика">
            <input type="number" id="gradeInput" placeholder="Оценка" min="1" max="5">
            <input type="text" id="homeworkInput" placeholder="Домашнее задание">
            <button onclick="addRecord()">Добавить</button>
        </div>

        <h2>Список успеваемости</h2>
        <table>
            <thead>
                <tr>
                    <th>Ученик</th>
                    <th>Оценка</th>
                    <th>Домашнее задание</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="diaryTableBody">
                <!-- Сюда JavaScript будет добавлять строки -->
            </tbody>
        </table>
    </div>

    <!-- ВКЛАДКА 2: РАСПИСАНИЕ (Пока пустая) -->
    <div id="scheduleTab" class="tab-content">
        <h1>📅 Расписание уроков</h1>
        <p class="placeholder-text">Здесь пока ничего нет. Раздел находится в разработке.</p>
    </div>

    <!-- ВКЛАДКА 3: ОЦЕНКИ (Пока пустая) -->
    <div id="gradesTab" class="tab-content">
        <h1>📊 Сводный отчет по оценкам</h1>
        <p class="placeholder-text">Здесь пока ничего нет. Раздел находится в разработке.</p>
    </div>
</div>

<script>
    // ФУНКЦИЯ ДЛЯ ПЕРЕКЛЮЧЕНИЯ ВКЛАДОК
    function switchTab(tabId, buttonElement) {
        // 1. Скрываем весь контент вкладок
        const contents = document.querySelectorAll('.tab-content');
        contents.forEach(content => content.classList.remove('active'));

        // 2. Делаем все кнопки меню неактивными
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        // 3. Показываем нужный контент и делаем кликнутую кнопку активной
        document.getElementById(tabId).classList.add('active');
        buttonElement.classList.add('active');
    }

    // ЛОГИКА ДНЕВНИКА (из прошлого шага)
    let diaryData = JSON.parse(localStorage.getItem('myDiaryData')) || [];

    window.onload = function() {
        renderTable();
    };

    function renderTable() {
        const tableBody = document.getElementById('diaryTableBody');
        tableBody.innerHTML = '';

        diaryData.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>${item.grade}</td>
                <td>${item.homework}</td>
                <td><button class="delete-btn" onclick="deleteRecord(${index})">Удалить</button></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function addRecord() {
        const name = document.getElementById('nameInput').value;
        const grade = document.getElementById('gradeInput').value;
        const homework = document.getElementById('homeworkInput').value;

        if (!name || !grade || !homework) {
            alert('Пожалуйста, заполните все поля!');
            return;
        }

        const newStudent = { name, grade, homework };
        diaryData.push(newStudent);
        saveAndRefresh();

        document.getElementById('nameInput').value = '';
        document.getElementById('gradeInput').value = '';
        document.getElementById('homeworkInput').value = '';
    }

    function deleteRecord(index) {
        diaryData.splice(index, 1);
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('myDiaryData', JSON.stringify(diaryData));
        renderTable();
    }
</script>

</body>
</html>
