<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в команду Мирополис</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container" id="loginSection">
        <h1>Мирополис</h1>
        <div class="login-card">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" placeholder="Введите ваше имя" required>
            </div>
            <div class="form-group">
                <label for="login">Ваш игровой логин</label>
                <input type="text" id="login" placeholder="Ваш игровой логин" required>
            </div>
            <div class="form-group">
                <label for="position">Должность</label>
                <input type="text" id="position" placeholder="Укажите вашу должность" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required>
            </div>
            <button type="button" onclick="handleLogin()" class="login-btn">ВОЙТИ В СИСТЕМУ</button>
        </div>
    </div>

    <div class="main-menu" id="mainMenu" style="display: none;">
        <h2>Добро пожаловать в Мирополис!</h2>
        <nav>
            <ul class="menu-nav">
                <li><a href="#objects" onclick="showObjects()">Объекты</a></li>
                <li><a href="#settings">Настройки</a></li>
                <li><a href="#" onclick="showLogin()">Выйти</a></li>
            </ul>
        </nav>

        <div id="objects" class="content-section" style="display: none;">
            <h3>Объекты</h3>
            <nav>
                <ul class="submenu-nav">
                    <li><a href="#cities" onclick="showCities()">Города</a></li>
                    <li><a href="#buildings">Здания</a></li>
                    <li><a href="#territories">Территории</a></li>
                </ul>
            </nav>

            <div id="cities" class="subcontent-section" style="display: none;">
                <h4>Города</h4>
                <p>Здесь будет список городов и их параметры.</p>
                <!-- Сюда можно добавить список городов -->
            </div>
        </div>

        <div id="settings" class="content-section" style="display: none;">
            <h3>Настройки</h3>
            <p>Здесь будут настройки аккаунта и сервера.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
