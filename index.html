<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в команду Мирополис</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container" id="loginSection">
        <div class="login-card">
            <h2 class="login-title">Вход в команду <span class="server-name">Мирополис</span></h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Имя пользователя</label>
                    <input type="text" id="username" class="form-input" placeholder="Введите ваше имя" required>
                </div>
                <div class="form-group">
                    <label for="login" class="form-label">Логин</label>
                    <input type="text" id="login" class="form-input" placeholder="Ваш игровой логин" required>
                </div>
                <div class="form-group">
                    <label for="position" class="form-label">Должность</label>
                    <input type="text" id="position" class="form-input" placeholder="Укажите вашу должность" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn" onclick="handleLogin()">Войти в систему</button>
            </form>
        </div>
    </div>

    <!-- Блок главного меню (скрыт по умолчанию) -->
    <div class="main-menu" id="mainMenu" style="display: none;">
        <div class="menu-header">
            <h1>Добро пожаловать в Мирополис!</h1>
            <p>Статус: В системе</p>
            <button class="logout-btn" onclick="showLogin()">Выйти</button>
        </div>
        <div class="menu-content">
            <div class="menu-grid">
                <div class="menu-item">
                    <h3>Управление игроками</h3>
                    <p>Просмотр и редактирование аккаунтов</p>
                </div>
                <div class="menu-item">
                    <h3>Настройки сервера</h3>
                    <p>Конфигурация и параметры сервера</p>
                </div>
                <div class="menu-item">
                    <h3>Логи действий</h3>
                    <p>История действий на сервере</p>
                </div>
                <div class="menu-item">
                    <h3>Чат модерации</h3>
                    <p>Мониторинг игрового чата</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
