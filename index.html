<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Симулятор Лифта 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ЛЕВАЯ СТОРОНА: Вид от первого лица -->
        <div class="view-first-person">
            
            <!-- СЦЕНА 1: Вы стоите в холле перед лифтом -->
            <div class="scene active" id="scene-hall">
                <div class="hall-indicator">
                    <div class="floor-num" id="hallDisplay">01</div>
                    <div class="arrow" id="hallArrow">●</div>
                </div>
                
                <div class="elevator-portal">
                    <div class="doors-container" id="hallDoors">
                        <div class="door left-wing"></div>
                        <div class="door right-wing"></div>
                    </div>
                    <!-- Проблеск кабины сзади -->
                    <div class="cabin-preview"></div>
                </div>

                <div class="hall-controls">
                    <div class="location-info">Вы находитесь на <span id="userFloorText">01</span> этаже</div>
                    <button class="btn-call-elevator" id="btnCall">▲▼ ВЫЗВАТЬ ЛИФТ</button>
                </div>
            </div>

            <!-- СЦЕНА 2: Вы зашли ИНСАЙД (Внутрь кабины) -->
            <div class="scene" id="scene-cabin">
                <div class="cabin-interior">
                    <!-- Левая часть кабины: Зеркало и медиа-экран -->
                    <div class="cabin-left">
                        <div class="cabin-media-screen">
                            <div class="media-floor" id="cabinDisplay">01</div>
                            <div class="media-status" id="cabinStatus">СТЕНДБАЙ</div>
                        </div>
                        <div class="cabin-mirror"></div>
                    </div>

                    <!-- Правая часть кабины: Большая сенсорная панель приказов -->
                    <div class="cabin-right">
                        <div class="touch-panel">
                            <div class="panel-header">SMART ELEVATOR SYSTEM</div>
                            <div class="buttons-grid" id="buttonsGrid"></div>
                            <div class="panel-footer">=== OTIS / KONE 2026 ===</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Информационный подвал для игрока -->
            <div class="status-bar" id="playerStatus">Вы стоите в холле. Нажмите кнопку вызова лифта.</div>
        </div>

        <!-- ПРАВАЯ СТОРОНА: Интерактивный монитор шахты (как у вас) -->
        <div class="view-shaft-schema">
            <div class="schema-title">МОНИТОР ШАХТЫ</div>
            <div class="shaft-container">
                <div class="shaft-rail">
                    <div class="mini-car" id="miniCar">
                        <div class="mini-car-light"></div>
                    </div>
                </div>
                <div class="floor-labels" id="floorLabels"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
