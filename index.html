<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Симулятор Лифта Премиум</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- БЛОК 1: Кабина лифта и Двери (Вид изнутри) -->
        <div class="view-cabin">
            <div class="block-title">КУПЕ КАБИНЫ</div>
            <div class="cabin-interior">
                <!-- ЖК-Медиаэкран лифта -->
                <div class="media-screen">
                    <div class="media-row">
                        <div class="floor-num" id="mainDisplay">01</div>
                        <div class="arrow" id="mainArrow">●</div>
                    </div>
                    <div class="status-text" id="statusText">СТЕНДБАЙ</div>
                </div>
                
                <!-- Зеркало в кабине -->
                <div class="mirror">
                    <div class="mirror-reflection"></div>
                </div>

                <!-- Раздвижные двери кабины -->
                <div class="doors-portal">
                    <div class="doors-wrapper" id="elevatorDoors">
                        <div class="door left-wing"></div>
                        <div class="door right-wing"></div>
                    </div>
                    <!-- Вид на стену шахты за дверями -->
                    <div class="shaft-backwall"></div>
                </div>
            </div>
        </div>

        <!-- БЛОК 2: Сенсорная Панель Приказов (Всегда доступна) -->
        <div class="view-panel">
            <div class="block-title">ПАНЕЛЬ ПРИКАЗОВ</div>
            <div class="touch-panel">
                <div class="panel-header">SMART LIFT SYSTEM</div>
                
                <!-- Сетка круглых кнопок 1-16 -->
                <div class="buttons-grid" id="buttonsGrid"></div>
                
                <!-- Сервисные кнопки -->
                <div class="service-buttons">
                    <button class="btn-service" id="btnOpen">◄||►</button>
                    <button class="btn-service" id="btnClose">►||◄</button>
                </div>
            </div>
        </div>

        <!-- БЛОК 3: Монитор Шахты (Как на вашем скриншоте) -->
        <div class="view-shaft-schema">
            <div class="block-title">МОНИТОР ШАХТЫ</div>
            <div class="shaft-container">
                <div class="shaft-rail">
                    <div class="mini-car" id="miniCar">
                        <div class="mini-car-light"></div>
                    </div>
                </div>
                <div class="floor-labels" id="floorLabels"></div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
