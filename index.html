```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мирополис | Вход</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,0.55),
        rgba(0,0,0,0.55)
    ),
    url("moscow.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.login-box{
    width:450px;
    padding:40px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.2);
    border-radius:24px;

    box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    color:white;
    font-size:48px;
    margin-bottom:8px;
}

.logo p{
    color:#d1d5db;
    font-size:18px;
}

label{
    display:block;
    color:white;
    margin-bottom:8px;
    margin-top:18px;
    font-weight:600;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#d1d5db;
}

input:focus{
    outline:none;
    background:rgba(255,255,255,0.22);
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;

    border:none;
    border-radius:12px;

    background:#f59e0b;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#d97706;
}

#error{
    text-align:center;
    color:#ffb4b4;
    margin-top:15px;
}

.footer{
    text-align:center;
    color:#cbd5e1;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>🏙 Мирополис</h1>
        <p>Панель управления строителей</p>
    </div>

    <label>Имя пользователя</label>
    <input type="text" id="login" placeholder="Введите логин">

    <label>Пароль</label>
    <input type="password" id="password" placeholder="Введите пароль">

    <button onclick="login()">
        Войти
    </button>

    <div id="error"></div>

    <div class="footer">
        Мирополис © 2026
    </div>

</div>

<script>
function login(){

    const login =
    document.getElementById("login").value;

    const password =
    document.getElementById("password").value;

    if(login === "admin" && password === "12345"){
        alert("Добро пожаловать в Мирополис!");
    }
    else{
        document.getElementById("error").innerText =
        "Неверный логин или пароль";
    }
}
</script>

</body>
</html>
```
