<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор БПЛА: FP-1 и Герань-2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1>🛸 Демонстрация БПЛА: FP-1 и Герань-2</h1>
            <p>Нажмите кнопки ниже, чтобы выпустить детальные модели дронов на тестовый полигон</p>
        </header>

        <main>
            <div class="canvas-container">
                <canvas id="mapCanvas" width="900" height="450"></canvas>
            </div>

            <div class="control-panel">
                <button id="spawn-fp1">⚡ Запустить FPV-дрон «FP-1»</button>
                <button id="spawn-geran">📐 Запустить БПЛА «Герань-2»</button>
            </div>
        </main>
        <div class="log">Модели имеют реальные пропорции фюзеляжа и крыльев (вид сверху).</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
