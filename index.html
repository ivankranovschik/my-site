<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Дневник</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стильный бейдж для даты */
        .date-badge {
            background: linear-gradient(135deg, #e0e7ff 0%, #ccfbf1 100%);
            color: #4338ca;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 4px rgba(67, 56, 202, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <header class="diary-header">
        <button id="btn-schedule" class="nav-btn active">📅 Расписание</button>
        <button id="btn-grades" class="nav-btn">📊 Оценки</button>
    </header>

    <main class="content-container">
        <section id="section-schedule" class="content-section active">
            <div id="schedule-grid" class="schedule-grid"></div>
        </section>

        <section id="section-grades" class="content-section">
            <p style="text-align:center; color:#64748b; margin-top:50px; font-size: 18px;">Раздел оценок находится в разработке.</p>
        </section>
    </main>

    <script>
        const subjects = ["Математика", "Русский язык", "Литература", "История", "Физика", "Химия", "Биология", "География", "Английский язык", "Физкультура", "Информатика", "Обществознание"];
        const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница"];
        const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
        
        const grid = document.getElementById("schedule-grid");

        // Вычисляем даты для текущей недели (начиная с понедельника)
        const current = new Date();
        const currentDay = current.getDay();
        const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay; // Корректировка, если сегодня воскресенье
        const monday = new Date(current.setDate(current.getDate() + distanceToMonday));

        days.forEach((day, index) => {
            const dayCard = document.createElement("div");
            dayCard.className = "day-card";
            
            // Вычисляем точную дату для конкретного дня недели
            const dateForDay = new Date(monday);
            dateForDay.setDate(monday.getDate() + index);
            const dateString = `${dateForDay.getDate()} ${months[dateForDay.getMonth()]}`;

            const lessonsCount = Math.floor(Math.random() * 2) + 6; // 6-7 уроков
            
            // Вставляем название дня и красивый бейдж даты вместо счётчика уроков
            dayCard.innerHTML = `
                <h3>${day} <span class="date-badge">🗓️ ${dateString}</span></h3>
                <div class="table-header">
                    <div style="text-align: center;">№</div>
                    <div>УРОК</div>
                    <div>ДОМАШНЕЕ ЗАДАНИЕ</div>
                    <div style="text-align: center;">ОЦЕНКА</div>
                </div>
            `;
            
            const listContainer = document.createElement("div");

            for (let i = 0; i < lessonsCount; i++) {
                const randomSubject = subjects[Math.floor(Math.random() * subjects.length)];
                const row = document.createElement("div");
                row.className = "lesson-row";
                
                row.innerHTML = `
                    <div class="col-num">${i + 1}</div>
                    <div class="col-subject">${randomSubject}</div>
                    <div class="col-homework">не задано</div>
                    <div class="col-grade"></div>
                `;
                listContainer.appendChild(row);
            }

            dayCard.appendChild(listContainer);
            grid.appendChild(dayCard);
        });

        // Логика вкладок
        const btnSchedule = document.getElementById("btn-schedule");
        const btnGrades = document.getElementById("btn-grades");
        const secSchedule = document.getElementById("section-schedule");
        const secGrades = document.getElementById("section-grades");

        btnSchedule.addEventListener("click", () => {
            btnSchedule.classList.add("active"); btnGrades.classList.remove("active");
            secSchedule.classList.add("active"); secGrades.classList.remove("active");
        });
        btnGrades.addEventListener("click", () => {
            btnGrades.classList.add("active"); btnSchedule.classList.remove("active");
            secGrades.classList.add("active"); secSchedule.classList.remove("active");
        });
    </script>
</body>
</html>
