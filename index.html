<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в команду Мирополис</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2 class="login-title">Вход в команду <span class="server-name">Мирополис</span></h2>
            <form class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Имя пользователя</label>
                    <input type="text" id="username" class="form-input" placeholder="Введите ваше имя" required>
                </div>
                <div class="form-group">
                    <label for="login" class="form-label">Логин</label>
                    <input type="text" id="login" class="form-input" placeholder="Ваш игровой логин" required>
                </div>
                <div class="form-group">
                    <label for="position" class="form-label">Должность</label>
                    <select id="position" class="form-select" required>
                        <option value="" disabled selected>Выберите должность</option>
                        <option value="admin">Администратор</option>
                        <option value="moderator">Модератор</option>
                        <option value="builder">Строитель</option>
                        <option value="developer">Разработчик</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn">Войти в систему</button>
            </form>
        </div>
    </div>
</body>
</html>
