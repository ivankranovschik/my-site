<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Заправки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>⛽ Gas Station Tycoon</h1>
        
        <div class="stats">
            <p>💰 Баланс: $<span id="money">2000</span></p>
            <p>⛽ Топливо: <span id="fuel">500</span> / 1000 л</p>
            <p>💵 Цена продажи: $<span id="price">2.5</span>/л</p>
        </div>

        <div class="station-visual">
            <div id="car" class="car hidden">🚗</div>
            <div class="pump">⛽</div>
        </div>

        <div class="actions">
            <button id="serve-btn" disabled>Заправить клиента</button>
            <button id="buy-fuel-btn">Закупить 100л бензина (-$120)</button>
            <button id="raise-price-btn">Повысить цену (+$0.5)</button>
            <button id="lower-price-btn">Снизить цену (-$0.5)</button>
        </div>

        <div id="log" class="log">Ожидание клиентов...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
