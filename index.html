<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Дневник</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .date-badge {
            background: linear-gradient(135deg, #e0e7ff 0%, #ccfbf1 100%);
            color: #4338ca; padding: 5px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 600; box-shadow: 0 2px 4px rgba(67, 56, 202, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        /* Общие стили форм */
        .admin-form {
            display: flex; flex-direction: column; gap: 15px; margin-top: 20px;
            background: #f8fafc; padding: 20px; border-radius: 14px; border: 1px solid #e2e8f0;
        }
        .admin-form h3 { margin: 0 0 10px 0; color: #1e293b; font-size: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .form-group input, .form-group select {
            padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1;
            font-size: 14px; outline: none; background: #ffffff; color: #2d3748;
        }
        .form-group input:focus, .form-group select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        /* Стили для управления днями в конструкторе */
        .day-controls {
            display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .day-btn {
            padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 8px;
            background: #ffffff; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: all 0.2s; color: #475569;
        }
        .day-btn.active {
            background: #4f46e5; color: #ffffff; border-color: #4f46e5;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
        .constructor-day-box {
            background: #ffffff; padding: 15px; border-radius: 10px;
            border: 1px solid #e2e8f0; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .constructor-day-box h4 { margin: 0; color: #1e293b; font-size: 15px; }
        
        .submit-btn {
            padding: 12px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); transition: all 0.2s;
        }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3); }
        .success-toast { color: #16a34a; font-weight: 600; font-size: 14px; text-align: center; display: none; margin-top: 10px; }
        .logout-btn { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .logout-btn:hover { background: #fca5a5; }
        .school-display, .class-display { font-size: 13px; font-weight: bold; background: #eef2ff; padding: 6px 12px; border-radius: 8px; border: 1px solid #e0e7ff; }
        .school-display { color: #4f46e5; }
        .class-display { color: #10b981; background: #ecfdf5; border-color: #d1fae5; }

        .viewer-box {
            background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
            border: 2px dashed #3b82f6; border-radius: 14px; padding: 20px; margin-top: 15px;
        }
        .viewer-day-title { font-weight: bold; color: #1e3a8a; margin: 10px 0 5px 0; font-size: 15px; }
        .viewer-lesson-item { background: #ffffff; padding: 6px 12px; border-radius: 6px; border: 1px solid #dbeafe; font-size: 14px; margin-bottom: 4px; display: inline-block; margin-right: 5px; }
        
        /* Стили заглушки "В разработке" */
        .dev-placeholder {
            text-align: center; 
            color: #64748b; 
            margin-top: 80px; 
            font-size: 22px; 
            font-weight: 600;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ С ЯРКИМ ГРАДИЕНТОМ И СФЕРАМИ -->
    <div id="login-screen" class="login-screen">
        <div class="bg-sphere sphere-1"></div>
        <div class="bg-sphere sphere-2"></div>
        <div class="bg-sphere sphere-3"></div>
        <div class="bg-sphere sphere-4"></div>

        <div class="login-card">
            <h2>Электронный Дневник</h2>
            <div class="title-line"></div>
            <p>Пожалуйста, войдите в свой аккаунт</p>
            
            <div class="input-group">
                <label>Выберите роль</label>
                <select id="user-role">
                    <option value="Создатель" selected>Создатель</option>
                    <option value="Администратор">Администратор</option>
                    <option value="Директор">Директор</option>
                    <option value="Учитель">Учитель</option>
                    <option value="Педагог">Педагог</option>
                    <option value="Ученик">Ученик</option>
                </select>
            </div>

            <!-- Контейнер школы -->
            <div class="input-group" id="school-group">
                <label id="school-label">Выберите школу</label>
                <select id="login-school">
                    <option value="Школа №1">Школа №1</option>
                </select>
            </div>

            <div class="input-group">
                <label>Имя пользователя</label>
                <input type="text" id="display-name" placeholder="Например: Иван">
            </div>

            <div class="input-group">
                <label>Логин</label>
                <input type="text" id="username" placeholder="Введите логин">
            </div>
            
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            
            <button id="login-btn" class="login-btn">Войти в систему</button>
            <div id="error-msg" class="error-message">Неверные имя, логин или пароль!</div>
        </div>
    </div>

    <!-- ПАНЕЛЬ НАВИГАЦИИ -->
    <header class="diary-header">
        <button id="btn-schedule" class="nav-btn active">📅 Расписание</button>
        <button id="btn-grades" class="nav-btn">📊 Оценки</button>
        <button id="btn-admin" class="nav-btn">🛡️ Модерирование</button>
        
        <div id="user-display" class="user-greeting" style="display: none;">
            <span id="greet-school" class="school-display" style="display: none;">Школа</span>
            <span id="greet-class" class="class-display" style="display: none;">Класс</span>
            <span id="greet-name">👤 Пользователь</span>
            <span id="greet-role" class="role-tag">Роль</span>
            <button id="logout-btn" class="logout-btn">Выйти</button>
        </div>
    </header>

    <!-- КОНТЕНТ -->
    <main class="content-container">
        <!-- Вкладка 1: Расписание -->
        <section id="section-schedule" class="content-section active">
            <div class="dev-placeholder">📅 Раздел расписания находится в разработке...</div>
        </section>

        <!-- Вкладка 2: Оценки -->
        <section id="section-grades" class="content-section">
            <div class="dev-placeholder">📊 Раздел оценок находится в разработке...</div>
        </section>

        <!-- Вкладка 3: Модерирование -->
        <section id="section-admin" class="content-section">
            <div class="dev-placeholder">🛡️ Раздел модерирования находится в разработке...</div>
        </section>
    </main>

    <!-- ВСЯ ЛОГИКА SYSTEM (JS) -->
    <script>
        // Элементы управления полями
        const userRoleSelect = document.getElementById('user-role');
        const schoolGroup = document.getElementById('school-group');
        
        // Элементы авторизации
        const loginScreen = document.getElementById('login-screen');
        const loginBtn = document.getElementById('login-btn');
        const displayNameInput = document.getElementById('display-name');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        
        // Элементы шапки пользователя
        const userDisplay = document.getElementById('user-display');
        const greetName = document.getElementById('greet-name');
        const greetRole = document.getElementById('greet-role');
        const logoutBtn = document.getElementById('logout-btn');

        // Элементы вкладок меню
        const btnSchedule = document.getElementById('btn-schedule');
        const btnGrades = document.getElementById('btn-grades');
        const btnAdmin = document.getElementById('btn-admin');

        const secSchedule = document.getElementById('section-schedule');
        const secGrades = document.getElementById('section-grades');
        const secAdmin = document.getElementById('section-admin');

        // 1. Функция скрытия школы для Создателя
        function toggleSchoolField() {
            if (userRoleSelect.value === 'Создатель') {
                schoolGroup.style.display = 'none';
            } else {
                schoolGroup.style.display = 'block';
            }
        }
        userRoleSelect.addEventListener('change', toggleSchoolField);
        window.addEventListener('DOMContentLoaded', toggleSchoolField);

        // 2. Функция авторизации (Проверка: Админ / Admin / 1234)
        loginBtn.addEventListener('click', () => {
            const nameValue = displayNameInput.value.trim();
            const loginValue = usernameInput.value.trim();
            const passValue = passwordInput.value.trim();
            const roleValue = userRoleSelect.value;

            if (nameValue === 'Админ' && loginValue === 'Admin' && passValue === '1234') {
                // Скрываем ошибку и форму входа
                errorMsg.style.display = 'none';
                loginScreen.classList.add('hidden');
                
                // Настраиваем шапку пользователя
                userDisplay.style.display = 'flex';
                greetName.textContent = `👤 ${nameValue}`;
                greetRole.textContent = roleValue;
                
                // Применяем правильный цвет тегу роли
                greetRole.className = 'role-tag'; 
                if (roleValue === 'Создатель') greetRole.classList.add('role-creator');
                else if (roleValue === 'Администратор') greetRole.classList.add('role-admin');
                else if (roleValue === 'Директор') greetRole.classList.add('role-director');
                else if (roleValue === 'Учитель') greetRole.classList.add('role-teacher');
                else if (roleValue === 'Педагог') greetRole.classList.add('role-pedagogue');
                else if (roleValue === 'Ученик') greetRole.classList.add('role-student');

            } else {
                // Показываем сообщение об ошибке
                errorMsg.style.display = 'block';
            }
        });

        // 3. Выход из аккаунта
        logoutBtn.addEventListener('click', () => {
            loginScreen.classList.remove('hidden');
            userDisplay.style.display = 'none';
            passwordInput.value = ''; // очищаем пароль
        });

        // 4. Логика переключения сочных вкладок
        function switchTab(activeBtn, activeSection) {
            // Убираем активность у всех кнопок и секций
            [btnSchedule, btnGrades, btnAdmin].forEach(b => b.classList.remove('active'));
            [secSchedule, secGrades, secAdmin].forEach(s => s.classList.remove('active'));
            
            // Добавляем активность выбранным
            activeBtn.classList.add('active');
            activeSection.classList.add('active');
        }

        btnSchedule.addEventListener('click', () => switchTab(btnSchedule, secSchedule));
        btnGrades.addEventListener('click', () => switchTab(btnGrades, secGrades));
        btnAdmin.addEventListener('click', () => switchTab(btnAdmin, secAdmin));
    </script>
</body>
</html>
