<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мирополис | Premium System</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --prm: #ff00cc; --sec: #3333ff; --acc: #00ffff; --glass: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; overflow: hidden; color: #fff; }

        /* ФОН */
        .bg-layer { position: absolute; width: 100%; height: 100%; background: #08080a; z-index: -2; }
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6; z-index: -1; animation: move 20s infinite alternate; }
        .orb-1 { width: 500px; height: 500px; background: var(--prm); top: -10%; left: -10%; }
        .orb-2 { width: 600px; height: 600px; background: var(--sec); bottom: -10%; right: -10%; }
        @keyframes move { from { transform: translate(0,0); } to { transform: translate(100px, 50px); } }

        /* ВХОД */
        .glass-box { position: relative; width: 420px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.2); border-radius: 30px; padding: 50px 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-family: 'Orbitron'; font-size: 28px; letter-spacing: 5px; margin-bottom: 30px; }
        h1 span { background: linear-gradient(to right, var(--prm), var(--acc)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px var(--prm)); }
        input { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; outline: none; }
        .auth-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(45deg, var(--prm), var(--sec)); color: #fff; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 0, 204, 0.4); }

        /* ПАНЕЛЬ */
        .top-nav { position: fixed; top: 20px; right: 20px; display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .mini-avatar { width: 35px; height: 35px; background: linear-gradient(45deg, var(--prm), var(--acc)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-family: 'Orbitron'; font-size: 14px; box-shadow: 0 0 10px var(--prm); }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 220px); gap: 20px; z-index: 10; }
        .menu-item { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 40px 20px; border-radius: 25px; text-align: center; cursor: pointer; transition: 0.4s; }
        .menu-item:hover { border-color: var(--acc); transform: translateY(-10px); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        .menu-item h3 { font-family: 'Orbitron'; font-size: 14px; margin-top: 15px; letter-spacing: 2px; }

        /* ГОРОДА */
        .objs-view { width: 95%; max-width: 1100px; height: 85vh; overflow-y: auto; text-align: center; padding: 50px 20px; scrollbar-width: none; }
        .cities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .city-card { background: rgba(255,255,255,0.03); border-radius: 24px; padding: 35px 25px; border: 1px solid rgba(255,255,255,0.1); transition: 0.4s; cursor: pointer; position: relative; overflow: hidden; }
        .city-card:hover:not(.locked) { border-color: var(--acc); transform: translateY(-8px); box-shadow: 0 10px 30px rgba(0, 242, 255, 0.15); }
        .city-card h4 { font-family: 'Orbitron'; font-size: 20px; letter-spacing: 2px; margin-bottom: 10px; }

        /* СТИЛЬ НОВОМОСКОВСКА */
        .city-card.locked { cursor: not-allowed; border: 1px dashed #ff4d4d; background: rgba(255, 77, 77, 0.05); }
        .city-card.locked h4 { color: #ff4d4d; opacity: 0.8; }
        .locked-tag { color: #ff4d4d; font-size: 11px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; animation: blinker 1.5s infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* МОДАЛКА */
        .full-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(20px); z-index: 3000; display: none; flex-direction: column; padding: 60px; animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 25px; }
        .tab-group { display: flex; gap: 40px; }
        .tab-link { background: none; border: none; color: #444; font-family: 'Orbitron'; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .tab-link.active { color: var(--acc); text-shadow: 0 0 20px var(--acc); }
        .content-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; font-size: 48px; font-family: 'Orbitron'; color: rgba(255,255,255,0.05); letter-spacing: 15px; font-weight: 900; }
        .close-btn { background: none; border: 2px solid var(--prm); color: var(--prm); padding: 12px 30px; border-radius: 15px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700; transition: 0.3s; }
        .close-btn:hover { background: var(--prm); color: #fff; box-shadow: 0 0 20px var(--prm); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="orb orb-1"></div><div class="orb orb-2"></div>

    <!-- ВХОД -->
    <div id="login-screen" class="glass-box">
        <h1>ВХОД<span> НА САЙТ</span></h1>
        <input type="text" id="n" placeholder="Имя">
        <input type="text" id="l" placeholder="Логин">
        <input type="text" id="r" placeholder="Звание">
        <input type="password" id="p" placeholder="Пароль">
        <button class="auth-btn" onclick="startSystem()">ПОДТВЕРДИТЬ ЛИЧНОСТЬ</button>
    </div>

    <!-- ДАШБОРД -->
    <div id="dashboard" class="hidden" style="flex-direction: column; align-items: center; width: 100%;">
        <nav class="top-nav">
            <div class="mini-avatar">K</div>
            <div style="font-family: 'Orbitron'; font-size: 11px;"><span id="u-n" style="color: var(--acc);"></span><br><span id="u-r" style="font-size: 8px; color: #555;"></span></div>
            <button onclick="location.reload()" style="background:none; border:1px solid var(--prm); color:#fff; padding:6px 15px; border-radius:12px; cursor:pointer; font-size:10px; margin-left:10px; font-family: 'Orbitron';">ВЫХОД</button>
        </nav>

        <div id="menu-grid" class="menu-grid">
            <div class="menu-item" onclick="toggleView('objs')"><span style="font-size:45px;">🏗️</span><h3>ОБЪЕКТЫ</h3></div>
            <div class="menu-item"><h3>КОМАНДА</h3></div>
            <div class="menu-item"><h3>ЧЕРТЕЖИ</h3></div>
            <div class="menu-item"><h3>СИСТЕМА</h3></div>
        </div>

        <div id="objs-view" class="objs-view hidden">
            <button onclick="toggleView('menu')" style="background:none; border:2px solid var(--prm); color:#fff; padding:10px 25px; border-radius:15px; cursor:pointer; font-family:'Orbitron'; font-size:11px; margin-bottom:40px; transition: 0.3s;">← НАЗАД В МЕНЮ</button>
            <div class="cities-grid">
                <div class="city-card" onclick="showCity('РУБАЙСК')"><h4>РУБАЙСК</h4><span style="font-size:9px; color:#f1c40f; font-weight: 900; letter-spacing: 1px;">СТРОИТСЯ</span></div>
                <div class="city-card" onclick="showCity('МИНСК')"><h4>МИНСК</h4><span style="font-size:9px; color:#e67e22; font-weight: 900; letter-spacing: 1px;">ОЖИДАНИЕ</span></div>
                <div class="city-card" onclick="showCity('СЕВЕРОМОРСК')"><h4>СЕВЕРОМОРСК</h4><span style="font-size:9px; color:#e67e22; font-weight: 900; letter-spacing: 1px;">ОЖИДАНИЕ</span></div>
                <div class="city-card" onclick="showCity('ЕГОРОВСК')"><h4>ЕГОРОВСК</h4><span style="font-size:9px; color:#9b59b6; font-weight: 900; letter-spacing: 1px;">ПЕРЕНОС</span></div>
                <div class="city-card" onclick="showCity('ДУХОПОЛЬЕ')"><h4>ДУХОПОЛЬЕ</h4><span style="font-size:9px; color:#9b59b6; font-weight: 900; letter-spacing: 1px;">ПЕРЕНОС</span></div>
                <div class="city-card" onclick="showCity('МАГИСТРАЛЬСК')"><h4>МАГИСТРАЛЬСК</h4><span style="font-size:9px; color:#f1c40f; font-weight: 900; letter-spacing: 1px;">СТРОИТСЯ</span></div>
                <div class="city-card locked"><h4>НОВОМОСКОВСК</h4><span class="locked-tag">⚠ ОБСУЖДАЕТСЯ</span></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА -->
    <div id="city-modal" class="full-modal">
        <div class="modal-nav">
            <h2 id="m-t" style="font-family:'Orbitron'; color:var(--acc); font-size: 36px; letter-spacing: 5px;">ГОРOД</h2>
            <div class="tab-group">
                <button id="tp" class="tab-link active" onclick="tab('p')">ПЛАНЫ</button>
                <button id="tf" class="tab-link" onclick="tab('f')">ФОТО</button>
            </div>
            <button class="close-btn" onclick="closeCity()">ЗАКРЫТЬ</button>
        </div>
        <div id="display" class="content-area">СКОРО...</div>
    </div>

    <script>
        function startSystem() {

            const nv = document.getElementById('n').value;
const lv = document.getElementById('l').value;
const rv = document.getElementById('r').value;
const pv = document.getElementById('p').value;
if(nv === 'Kranovschik' && lv === 'Creator' && rv === 'Создатель' && pv === '12345') {
document.getElementById('login-screen').style.display = 'none';
document.getElementById('dashboard').classList.remove('hidden');
document.getElementById('dashboard').style.display = 'flex';
document.getElementById('u-n').innerText = nv;
document.getElementById('u-r').innerText = rv;
} else { alert('ОШИБКА ДОСТУПА'); }
}
function toggleView(v) {
document.getElementById('menu-grid').classList.toggle('hidden', v === 'objs');
document.getElementById('objs-view').classList.toggle('hidden', v === 'menu');
}
function showCity(n) { document.getElementById('m-t').innerText = n; document.getElementById('city-modal').style.display = 'flex'; tab('p'); }
function closeCity() { document.getElementById('city-modal').style.display = 'none'; }
function tab(t) {
document.getElementById('tp').classList.toggle('active', t === 'p');
document.getElementById('tf').classList.toggle('active', t === 'f');
document.getElementById('display').innerText = 'СКОРО...';
}
