<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Симулятор Лифта от 1-го Лица</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ЛЕВАЯ СТОРОНА: Вид от первого лица -->
        <div class="view-first-person">
            <!-- Табло над дверями (или внутри кабины) -->
            <div class="header-indicator">
                <div class="floor-display" id="mainDisplay">01</div>
                <div class="arrow-indicator" id="mainArrow">●</div>
            </div>

            <!-- Зона дверей лифта -->
            <div class="elevator-view-box">
                <!-- Внутренности кабины (видны, когда двери открыты) -->
                <div class="elevator-interior">
                    <div class="mirror"></div>
                    <!-- Панель приказов внутри кабины -->
                    <div class="car-panel" id="carPanel">
                        <div class="panel-brand">SMART LIFT</div>
                        <div class="buttons-grid" id="buttonsGrid"></div>
                    </div>
                </div>

                <!-- Раздвижные двери холла/кабины -->
                <div class="doors-wrapper" id="doorsWrapper">
                    <div class="door-wing left-wing"></div>
                    <div class="door-wing right-wing"></div>
                </div>
            </div>

            <!-- Кнопка вызова на этаже (доступна, когда вы снаружи) -->
            <div class="hall-call-box" id="hallCallBox">
                <div class="current-location-text">Вы стоите на <span id="userFloorText">01</span> этаже</div>
                <button class="btn-call" id="btnCallElevator">▲▼ Вызвать лифт</button>
            </div>
            
            <!-- Статус для подсказок игроку -->
            <div class="player-status" id="playerStatus">Лифт на 1 этаже. Двери закрыты. Нажмите «Вызвать лифт».</div>
        </div>

        <!-- ПРАВАЯ СТОРОНА: Схема движения в шахте -->
        <div class="view-shaft-schema">
            <div class="schema-title">МОНИТОР ШАХТЫ</div>
            <div class="shaft-container">
                <div class="shaft-rail">
                    <!-- Кабина на схеме -->
                    <div class="mini-car" id="miniCar">
                        <div class="mini-car-light"></div>
                    </div>
                </div>
                <!-- Метки этажей справа от рельса -->
                <div class="floor-labels" id="floorLabels"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
