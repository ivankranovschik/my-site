<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMIUM SYSTEM | LOGIN</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Живой анимированный фон -->
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="glass-box">
        <div class="glow-border"></div>
        <div id="login-section">
            <h1>CONTROL<span>PANEL</span></h1>
            <p class="brand">IVANKRANOVSCHIK ENTERPRISE</p>

            <div class="field">
                <input type="text" id="reg-name" placeholder=" " required>
                <label>ИМЯ ПОЛЬЗОВАТЕЛЯ</label>
            </div>

            <div class="field">
                <input type="text" id="reg-login" placeholder=" " required>
                <label>ЛОГИН</label>
            </div>

            <div class="field">
                <input type="text" id="reg-rank" placeholder=" " required>
                <label>ЗВАНИЕ</label>
            </div>

            <div class="field">
                <input type="password" id="reg-pass" placeholder=" " required>
                <label>ПАРОЛЬ</label>
            </div>

            <button type="button" class="auth-btn" onclick="validateUser()">
                ПОДТВЕРДИТЬ ЛИЧНОСТЬ
            </button>
        </div>

        <div id="creator-profile" class="profile-layout hidden">
            <div class="avatar-ring">
                <div class="avatar-core">K</div>
            </div>
            <div class="details">
                <h2 id="res-user"></h2>
                <p class="rank-label">СТАТУС: <span id="res-rank"></span></p>
                <div class="energy-bar"><div class="energy-fill"></div></div>
                <div class="access-text">СИСТЕМА РАЗБЛОКИРОВАНА</div>
            </div>
        </div>
    </div>

    <script>
        function validateUser() {
            const name = document.getElementById('reg-name').value;
            const login = document.getElementById('reg-login').value;
            const rank = document.getElementById('reg-rank').value;
            const pass = document.getElementById('reg-pass').value;

            if(name === 'Kranovschik' && login === 'Creator' && rank === 'Создатель' && pass === '12345') {
                document.getElementById('res-user').innerText = name;
                document.getElementById('res-rank').innerText = rank;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('creator-profile').classList.remove('hidden');
            } else {
                alert('ДОСТУП ЗАПРЕЩЕН');
            }
        }
    </script>
</body>
</html>
