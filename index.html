<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Дневник</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .date-badge {
            background: linear-gradient(135deg, #e0e7ff 0%, #ccfbf1 100%);
            color: #4338ca; padding: 5px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 600; box-shadow: 0 2px 4px rgba(67, 56, 202, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        /* Общие стили форм */
        .admin-form {
            display: flex; flex-direction: column; gap: 15px; margin-top: 20px;
            background: #f8fafc; padding: 20px; border-radius: 14px; border: 1px solid #e2e8f0;
        }
        .admin-form h3 { margin: 0 0 10px 0; color: #1e293b; font-size: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .form-group input, .form-group select {
            padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1;
            font-size: 14px; outline: none; background: #ffffff; color: #2d3748;
        }
        .form-group input:focus, .form-group select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        /* Стили для управления днями в конструкторе */
        .day-controls {
            display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .day-btn {
            padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 8px;
            background: #ffffff; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: all 0.2s; color: #475569;
        }
        .day-btn.active {
            background: #4f46e5; color: #ffffff; border-color: #4f46e5;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
        .constructor-day-box {
            background: #ffffff; padding: 15px; border-radius: 10px;
            border: 1px solid #e2e8f0; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .constructor-day-box h4 { margin: 0; color: #1e293b; font-size: 15px; }
        
        .submit-btn {
            padding: 12px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); transition: all 0.2s;
        }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3); }
        .success-toast { color: #16a34a; font-weight: 600; font-size: 14px; text-align: center; display: none; margin-top: 10px; }
        .logout-btn { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .logout-btn:hover { background: #fca5a5; }
        .school-display, .class-display { font-size: 13px; font-weight: bold; background: #eef2ff; padding: 6px 12px; border-radius: 8px; border: 1px solid #e0e7ff; }
        .school-display { color: #4f46e5; }
        .class-display { color: #10b981; background: #ecfdf5; border-color: #d1fae5; }

        .viewer-box {
            background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
            border: 2px dashed #3b82f6; border-radius: 14px; padding: 20px; margin-top: 15px;
        }
        .viewer-day-title { font-weight: bold; color: #1e3a8a; margin: 10px 0 5px 0; font-size: 15px; }
        .viewer-lesson-item { background: #ffffff; padding: 6px 12px; border-radius: 6px; border: 1px solid #dbeafe; font-size: 14px; margin-bottom: 4px; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ С ЯРКИМ ГРАДИЕНТОМ И СФЕРАМИ -->
    <div id="login-screen" class="login-screen">
        <div class="bg-sphere sphere-1"></div>
        <div class="bg-sphere sphere-2"></div>
        <div class="bg-sphere sphere-3"></div>
        <div class="bg-sphere sphere-4"></div>

        <div class="login-card">
            <h2>Электронный Дневник</h2>
            <div class="title-line"></div>
            <p>Пожалуйста, войдите в свой аккаунт</p>
            
            <div class="input-group">
                <label>Выберите роль</label>
                <select id="user-role">
                    <option value="Создатель" selected>Создатель</option>
                    <option value="Администратор">Администратор</option>
                    <option value="Директор">Директор</option>
                    <option value="Учитель">Учитель</option>
                    <option value="Педагог">Педагог</option>
                    <option value="Ученик">Ученик</option>
                </select>
            </div>

            <!-- Контейнер школы -->
            <div class="input-group" id="school-group">
                <label id="school-label">Выберите школу</label>
                <select id="login-school"></select>
            </div>

            <div class="input-group">
                <label>Имя пользователя</label>
                <input type="text" id="display-name" placeholder="Например: Иван">
            </div>

            <div class="input-group">
                <label>Логин</label>
                <input type="text" id="username" placeholder="Введите логин">
            </div>
            
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            
            <button id="login-btn" class="login-btn">Войти в систему</button>
            <div id="error-msg" class="error-message">Неверные данные или школа выбрана неправильно!</div>
        </div>
    </div>

    <!-- ПАНЕЛЬ НАВИГАЦИИ -->
    <header class="diary-header">
        <button id="btn-schedule" class="nav-btn active">📅 Расписание</button>
        <button id="btn-grades" class="nav-btn">📊 Оценки</button>
        <button id="btn-admin" class="nav-btn">🛡️ Модерирование</button>
        
        <div id="user-display" class="user-greeting" style="display: none;">
            <span id="greet-school" class="school-display" style="display: none;">Школа</span>
            <span id="greet-class" class="class-display" style="display: none;">Класс</span>
            <span id="greet-name">👤 Пользователь</span>
            <span id="greet-role" class="role-tag">Роль</span>
            <button id="logout-btn" class="logout-btn">Выйти</button>
        </div>
    </header>

    <!-- КОНТЕНТ -->
    <main class="content-container">
        <!-- КРАСИВОЕ ДИНАМИЧЕСКОЕ РАСПИСАНИЕ -->
        <section id="section-schedule" class="content-section active">
            <div id="schedule-grid" class="schedule-grid">
                <!-- Сюда JavaScript вставит сочные карточки дней -->
            </div>
        </section>

        <section id="section-grades" class="content-section">
            <div class="dev-box">
                <span>📊 Раздел оценок находится в разработке...</span>
            </div>
        </section>

        <!-- БЛОК МОДЕРИРОВАНИЯ -->
        <section id="section-admin" class="content-section">
            <div class="dev-box" style="margin-bottom: 30px;">
                <span>🛡️ Раздел модерирования находится в разработке...</span>
            </div>
            
            <div class="admin-panel" style="max-width: 800px; display: grid; gap: 20px; grid-template-columns: 1fr;">
                <h2>Панель управления системой</h2>
                
                <!-- ПРОСМОТРА РАСПИСАНИЯ КЛАССА -->
                <div class="admin-form" style="border: 2px solid #3b82f6; background: #ffffff;">
                    <h3 style="color: #1d4ed8;">🔍 Просмотр расписания класса</h3>
                    <div class="form-group">
                        <label>1. Выберите школу</label>
                        <select id="view-school-select"></select>
                    </div>
                    <div class="form-group">
                        <label>2. Выберите класс</label>
                        <select id="view-class-select">
                            <option value="">-- Сначала выберите школу --</option>
                        </select>
                    </div>
                    <button id="load-class-schedule-btn" class="submit-btn" style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);">Показать расписание</button>
                    <div id="schedule-viewer-output" class="viewer-box" style="display: none;"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- ВСЯ ЛОГИКА СИСТЕМЫ (АВТОРИЗАЦИЯ, ВКЛАДКИ, ГЕНЕРАЦИЯ УРОКОВ) -->
    <script>
        // Элементы формы авторизации
        const userRoleSelect = document.getElementById('user-role');
        const schoolGroup = document.getElementById('school-group');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loginScreen = document.getElementById('login-screen');
        const userDisplay = document.getElementById('user-display');
        const errorMsg = document.getElementById('error-msg');

        // Данные пользователя на форме
        const inputName = document.getElementById('display-name');
        const inputLogin = document.getElementById('username');
        const inputPass = document.getElementById('password');

        // Элементы шапки профиля
        const greetName = document.getElementById('greet-name');
        const greetRole = document.getElementById('greet-role');

        // Скрытие поля школы для создателя
        function toggleSchoolField() {
            if (userRoleSelect.value === 'Создатель') {
                schoolGroup.style.display = 'none';
            } else {
                schoolGroup.style.display = 'block';
            }
        }
        userRoleSelect.addEventListener('change', toggleSchoolField);
        window.addEventListener('DOMContentLoaded', toggleSchoolField);

        // Логика авторизации
        loginBtn.addEventListener('click', () => {
            const name = inputName.value.trim();
            const login = inputLogin.value.trim();
            const pass = inputPass.value;

            if (name === 'Админ' && login === 'Admin' && pass === '1234') {
                errorMsg.style.display = 'none';
                loginScreen.classList.add('hidden'); // Прячем экран входа
                userDisplay.style.display = 'flex';  // Показываем профиль
                
                greetName.textContent = `👤 ${name}`;
                greetRole.textContent = userRoleSelect.value;
                greetRole.className = `role-tag role-${getRoleClass(userRoleSelect.value)}`;
                
                generateBeautifulSchedule(); // Строим красивое расписание
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // Кнопка Выйти
        logoutBtn.addEventListener('click', () => {
            loginScreen.classList.remove('hidden');
            userDisplay.style.display = 'none';
            inputPass.value = '';
        });

        // Функция определения стиля плашки роли
        function getRoleClass(role) {
            const map = {
                'Создатель': 'creator',
                'Администратор': 'admin',
                'Директор': 'director',
                'Учитель': 'teacher',
                'Педагог': 'pedagogue',
                'Ученик': 'student'
            };
            return map[role] || 'student';
        }

        // Логика переключения сочных вкладок
        const tabs = [
            { btn: document.getElementById('btn-schedule'), sec: document.getElementById('section-schedule') },
            { btn: document.getElementById('btn-grades'), sec: document.getElementById('section-grades') },
            { btn: document.getElementById('btn-admin'), sec: document.getElementById('section-admin') }
        ];

        tabs.forEach(tab => {
            tab.btn.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.btn.classList.remove('active');
                    t.sec.classList.remove('active');
                });
                tab.btn.classList.add('active');
                tab.sec.classList.add('active');
            });
        });

        // ФУНКЦИЯ ГЕНЕРАЦИИ БОМБИЧЕСКОГО РАСПИСАНИЯ
        function generateBeautifulSchedule() {
            const grid = document.getElementById('schedule-grid');
            grid.innerHTML = ''; // Очищаем

            const days = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница'];
            const subjects = ['Математика', 'Русский язык', 'Литература', 'История', 'Физика', 'Химия', 'Биология', 'География', 'Английский язык', 'Информатика', 'Физкультура', 'Обществознание'];
            const homeworks = ['Параграф 14, упр. 3', 'Решить задачи 5 и 7 на стр. 89', 'Читать главу 3, выучить стих', 'Контурная карта стр. 12', 'Подготовиться к тесту', 'Доделать лабораторную работу', 'Повторить правила в тетради'];

            // Вычисляем текущие даты для дней недели
            const startOfWeek = new Date();
            const currentDay = startOfWeek.getDay();
            const distance = currentDay === 0 ? -6 : 1 - currentDay; // Корректировка на понедельник
            startOfWeek.setDate(startOfWeek.getDate() + distance);

            days.forEach((dayName, index) => {
                // Считаем дату для каждого дня
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(startOfWeek.getDate() + index);
                
                const options = { day: 'numeric', month: 'long' };
                const formattedDate = dayDate.toLocaleDateString('ru-RU', options);

                // Случайным образом выбираем 6 или 7 уроков для текущего дня
                const lessonsCount = Math.floor(Math.random() * 2) + 6; 

                // Создаем красивую карточку дня
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';

                let cardHTML = `
                    <h3>
                        <span>${dayName}</span>
                        <span class="date-badge">${formattedDate}</span>
                    </h3>
                    <div class="table-header">
                        <div class="col-num">№</div>
                        <div class="col-subject">Предмет</div>
                        <div class="col-homework">Домашнее задание</div>
                        <div class="col-grade">Оценка</div>
                    </div>
                `;

                // Генерируем строки уроков
                for (let i = 1; i <= lessonsCount; i++) {
                    const randomSubject = subjects[Math.floor(Math.random() * subjects.length)];
                    const randomHW = homeworks[Math.floor(Math.random() * homeworks.length)];
                    
                    // Генерируем случайную оценку (иногда пустая строка)
                    let gradeHTML = '';
                    if (Math.random() > 0.5) {
                        const grade = Math.floor(Math.random() * 4) + 2; // Оценки от 2 до 5
                        gradeHTML = `<span class="badge-grade grade-${grade}">${grade}</span>`;
                    }

                    cardHTML += `
                        <div class="lesson-row">
                            <div class="col-num">${i}</div>
                            <div class="col-subject">${randomSubject}</div>
                            <div class="col-homework">${randomHW}</div>
                            <div class="col-grade">${gradeHTML}</div>
                        </div>
                    `;
                }

                dayCard.innerHTML = cardHTML;
                grid.appendChild(dayCard);
            });
        }
    </script>
</body>
</html>
