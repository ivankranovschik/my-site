<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инженерный Симулятор Лифтового Оборудования</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scada-container">
        <!-- Левая часть: Мониторинг шахты -->
        <div class="shaft-section">
            <div class="section-title">МОНИТОР ШАХТЫ (16 ЭТАЖЕЙ)</div>
            <div class="shaft-wrapper">
                <!-- Цифры этажей слева от шахты -->
                <div class="floor-labels" id="floorLabels"></div>
                
                <div class="shaft">
                    <div class="floor-lines" id="floorLines"></div>
                    <!-- Кабина лифта -->
                    <div class="elevator" id="elevator">
                        <div class="elevator-ceiling-light"></div>
                        <div class="doors" id="doors">
                            <div class="door left-door"></div>
                            <div class="door right-door"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая часть: Станция управления ШУЛК/УЭЛ -->
        <div class="control-panel">
            <div class="section-title">СТАНЦИЯ УПРАВЛЕНИЯ ЛИФТОМ</div>
            
            <!-- Главное табло станции -->
            <div class="main-display-unit">
                <div class="direction-arrows">
                    <span class="arrow" id="arrow-up">▲ ВВЕРХ</span>
                    <span class="arrow" id="arrow-down">▼ ВНИЗ</span>
                </div>
                <div class="matrix-display" id="display">01</div>
                <div class="system-status" id="status-text">ГОТОВ</div>
            </div>

            <!-- Диагностический блок -->
            <div class="diagnostic-block">
                <div class="diag-row">Код ошибки ЦП: <span id="error-code" class="status-ok">НЕТ</span></div>
                <div class="diag-row">Матрица безопасности: <span id="safety-chain" class="status-ok">ЗАМКНУТА</span></div>
                <div class="diag-row">Статус кабины: <span id="passenger-status">СВОБОДНА</span></div>
            </div>

            <!-- Пульт инженера / Лифтёра -->
            <div class="engineer-tools">
                <div class="tools-title">ИНСТРУМЕНТЫ ВОССТАНОВЛЕНИЯ</div>
                <button class="btn-eng" id="btn-reboot">
                    <span class="icon">⚡</span> СБРОСИТЬ АВТОМАТ ПИТАНИЯ (QF1)
                </button>
                <button class="btn-eng" id="btn-calibrate" disabled>
                    <span class="icon">🔄</span> ИНИЦИАЛИЗАЦИЯ ШАХТЫ (РЕЙС НА 1 ЭТ.)
                </button>
            </div>

            <!-- Журнал ОДС (Объединенной Диспетчерской Службы) -->
            <div class="ods-journal">
                <div class="tools-title">ЖУРНАЛ СОБЫТИЙ ОДС</div>
                <div class="journal-log" id="job-log">
                    <div class="log-row sys">Система телеметрии запущена. Ошибок нет.</div>
                </div>
                <div class="stats-row">Выполнено вызовов: <span id="score-count">0</span></div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
