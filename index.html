<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мирополис | Система</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --prm: #ff00cc; --sec: #3333ff; --acc: #00ffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; overflow: hidden; color: #fff; }
        
        /* ФОН */
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; z-index: -1; }
        .orb-1 { width: 500px; height: 500px; background: var(--prm); top: -10%; left: -10%; }
        .orb-2 { width: 500px; height: 500px; background: var(--sec); bottom: -10%; right: -10%; }

        /* ВХОД */
        .glass-box { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 40px; width: 400px; text-align: center; }
        h1 { font-family: 'Orbitron'; margin-bottom: 20px; font-size: 24px; }
        h1 span { color: var(--prm); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; outline: none; }
        .auth-btn { width: 100%; padding: 12px; background: var(--prm); border: none; border-radius: 10px; color: #fff; font-family: 'Orbitron'; cursor: pointer; font-weight: bold; }

        /* ДАШБОРД */
        #dashboard { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center; }
        .top-nav { position: fixed; top: 20px; right: 20px; display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 200px); gap: 20px; }
        .menu-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .menu-item:hover { border-color: var(--acc); transform: translateY(-5px); }

        /* ГОРОДА */
        #objects-view { display: none; width: 90%; max-width: 1000px; height: 80vh; overflow-y: auto; text-align: center; }
        .cities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .city-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; cursor: pointer; }
        .city-card:hover { border-color: var(--acc); }
        .status { font-size: 10px; font-weight: bold; text-transform: uppercase; margin-top: 5px; display: block; }
        
        /* МОДАЛКА */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #111; border: 1px solid var(--acc); padding: 30px; border-radius: 20px; width: 400px; text-align: center; position: relative; }
        .tab-btn { background: none; border: 1px solid #333; color: #fff; padding: 5px 15px; cursor: pointer; margin: 10px 5px; border-radius: 5px; }
        .active-tab { border-color: var(--acc); color: var(--acc); }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div><div class="orb orb-2"></div>

    <div id="login-screen" class="glass-box">
        <h1>ВХОД <span>НА САЙТ</span></h1>
        <input type="text" id="name" placeholder="Имя пользователя">
        <input type="text" id="login" placeholder="Логин">
        <input type="text" id="rank" placeholder="Звание">
        <input type="password" id="pass" placeholder="Пароль">
        <button class="auth-btn" onclick="checkAuth()">ВОЙТИ</button>
    </div>

    <div id="dashboard">
        <div class="top-nav">
            <span id="user-info" style="font-size: 12px; font-family: 'Orbitron'; color: var(--acc);"></span>
            <button onclick="location.reload()" style="background:none; border:1px solid var(--prm); color:#fff; padding:5px 10px; border-radius:10px; cursor:pointer; font-size:10px;">ВЫХОД</button>
        </div>
        <div id="menu" class="menu-grid">
            <div class="menu-item" onclick="toggleView('objects')">🏗️<br>ОБЪЕКТЫ</div>
            <div class="menu-item">👥<br>КОМАНДА</div>
            <div class="menu-item">📁<br>ЧЕРТЕЖИ</div>
            <div class="menu-item">⚙️<br>СИСТЕМА</div>
        </div>

        <div id="objects-view">
            <button onclick="toggleView('menu')" style="margin-bottom:20px; background:none; border:1px solid var(--prm); color:#fff; padding:5px 15px; cursor:pointer;">← НАЗАД</button>
            <div class="cities-grid">
                <div class="city-card" onclick="openCity('РУБАЙСК')"><h4>РУБАЙСК</h4><span class="status" style="color:#f1c40f;">● Строится</span></div>
                <div class="city-card" onclick="openCity('МИНСК')"><h4>МИНСК</h4><span class="status" style="color:#e67e22;">● Ожидание</span></div>
                <div class="city-card" onclick="openCity('СЕВЕРОМОРСК')"><h4>СЕВЕРОМОРСК</h4><span class="status" style="color:#e67e22;">● Ожидание</span></div>
                <div class="city-card" onclick="openCity('ЕГОРОВСК')"><h4>ЕГОРОВСК</h4><span class="status" style="color:#9b59b6;">● Перенос</span></div>
                <div class="city-card" onclick="openCity('ДУХОПОЛЬЕ')"><h4>ДУХОПОЛЬЕ</h4><span class="status" style="color:#9b59b6;">● Перенос</span></div>
                <div class="city-card" onclick="openCity('МАГИСТРАЛЬСК')"><h4>МАГИСТРАЛЬСК</h4><span class="status" style="color:#f1c40f;">● Строится</span></div>
                <div class="city-card" style="border-style:dashed;" onclick="openCity('НОВОМОСКОВСК')"><h4>НОВОМОСКОВСК</h4><span class="status" style="color:var(--acc); animation:pulse 1s infinite;">⚠️ ОБСУЖДАЕТСЯ</span></div>
            </div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 id="m-title" style="font-family:'Orbitron';"></h2>
            <div>
                <button id="tp" class="tab-btn active-tab" onclick="tab('p')">ПЛАНЫ</button>
                <button id="tf" class="tab-btn" onclick="tab('f')">ФОТО</button>
            </div>
            <div id="cp" style="font-size:13px; color:#aaa; margin-top:20px;">● Проектирование зон<br>● Закупка ресурсов</div>
            <div id="cf" class="hidden" style="margin-top:20px;">[ НЕТ ДАННЫХ ]</div>
            <button onclick="document.getElementById('modal').style.display='none'" style="margin-top:30px; background:none; border:1px solid #444; color:#666; padding:5px 15px; cursor:pointer;">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        function checkAuth() {
            const n = document.getElementById('name').value;
            const l = document.getElementById('login').value;
            const r = document.getElementById('rank').value;
            const p = document.getElementById('pass').value;
            if(n==='Kranovschik' && l==='Creator' && r==='Создатель' && p==='12345') {
                document.getElementById('login-screen').style.display='none';
                document.getElementById('dashboard').style.display='flex';
                document.getElementById('user-info').innerText = n + ' | ' + r;
            } else { alert('Ошибка!'); }
        }
        function toggleView(v) {
            document.getElementById('menu').style.display = v==='menu'?'grid':'none';
            document.getElementById('objects-view').style.display = v==='objects'?'block':'none';
        }
        function openCity(n) {
            document.getElementById('m-title').innerText = n;
            document.getElementById('modal').style.display = 'flex';
            tab('p');
        }
        function tab(t) {
            document.getElementById('cp').classList.toggle('hidden', t==='f');
            document.getElementById('cf').classList.toggle('hidden', t==='p');
            document.getElementById('tp').classList.toggle('active-tab', t==='p');
            document.getElementById('tf').classList.toggle('active-tab', t==='f');
        }
    </script>
</body>
</html>
