<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Дневник</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для новой вертикальной структуры внутри урока */
        .lesson-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }
        .lesson-row {
            font-size: 14px;
            line-height: 1.4;
        }
        .lesson-label {
            font-weight: bold;
            color: #64748b; /* Серый цвет для подписей */
            margin-right: 5px;
        }
        .lesson-value {
            color: #1e293b; /* Темный цвет для значений */
        }
        /* Делаем название предмета чуть выделяющимся */
        .subject-highlight {
            font-weight: 600;
            color: #4f46e5; 
        }
        /* Подстраиваем высоту кружка с номером под новый размер карточки */
        .day-card li {
            align-items: flex-start;
            padding: 16px;
        }
        .lesson-number {
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header class="diary-header">
        <button id="btn-schedule" class="nav-btn active">📅 Расписание</button>
        <button id="btn-grades" class="nav-btn">📊 Оценки</button>
    </header>

    <main class="content-container">
        <section id="section-schedule" class="content-section active">
            <div id="schedule-grid" class="schedule-grid"></div>
        </section>

        <section id="section-grades" class="content-section">
            <p style="text-align:center; color:#64748b; margin-top:50px; font-size: 18px;">Раздел оценок находится в разработке.</p>
        </section>
    </main>

    <script>
        const subjects = ["Математика", "Русский язык", "Литература", "История", "Физика", "Химия", "Биология", "География", "Английский язык", "Физкультура", "Информатика", "Обществознание"];
        const times = ["08:00 - 08:45", "08:55 - 09:40", "09:50 - 10:35", "10:55 - 11:40", "11:55 - 12:40", "12:50 - 13:35", "13:45 - 14:30"];
        const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница"];
        
        const grid = document.getElementById("schedule-grid");

        days.forEach(day => {
            const dayCard = document.createElement("div");
            dayCard.className = "day-card";
            
            const lessonsCount = Math.floor(Math.random() * 2) + 6; 
            
            dayCard.innerHTML = `<h3>${day} <span>${lessonsCount} ур.</span></h3>`;
            const list = document.createElement("ul");

            for (let i = 0; i < lessonsCount; i++) {
                const li = document.createElement("li");
                const randomSubject = subjects[Math.floor(Math.random() * subjects.length)];
                
                // Создаем строго структурированный блок с подписями по строкам
                li.innerHTML = `
                    <div class="lesson-number">${i + 1}</div>
                    <div class="lesson-block">
                        <div class="lesson-time" style="margin-bottom: 5px;">⏰ ${times[i]}</div>
                        
                        <div class="lesson-row">
                            <span class="lesson-label">Урок:</span>
                            <span class="lesson-value subject-highlight">${randomSubject}</span>
                        </div>
                        
                        <div class="lesson-row">
                            <span class="lesson-label">Домашнее задание:</span>
                            <span class="lesson-value">не задано</span>
                        </div>
                        
                        <div class="lesson-row">
                            <span class="lesson-label">Оценка:</span>
                            <span class="lesson-value"></span>
                        </div>
                    </div>
                `;
                list.appendChild(li);
            }

            dayCard.appendChild(list);
            grid.appendChild(dayCard);
        });

        // Логика переключения вкладок
        const btnSchedule = document.getElementById("btn-schedule");
        const btnGrades = document.getElementById("btn-grades");
        const secSchedule = document.getElementById("section-schedule");
        const secGrades = document.getElementById("section-grades");

        btnSchedule.addEventListener("click", () => {
            btnSchedule.classList.add("active"); btnGrades.classList.remove("active");
            secSchedule.classList.add("active"); secGrades.classList.remove("active");
        });
        btnGrades.addEventListener("click", () => {
            btnGrades.classList.add("active"); btnSchedule.classList.remove("active");
            secGrades.classList.add("active"); secSchedule.classList.remove("active");
        });
    </script>
</body>
</html>
