<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Мирополис — Minecraft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Мирополис</h1>
            <p>Сервер строителей</p>
        </div>

        <form class="login-form">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" placeholder="Введите имя..." required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль..." required>
            </div>

            <button type="submit" class="login-btn">Войти</button>
        </form>
    </div>

    <script>
        // Простая проверка (только для вас)
        document.querySelector('form').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'Kranovschik' && password === '12345') {
                alert('Добро пожаловать, Kranovschik!');
                // Здесь можно перенаправить на главную страницу
            } else {
                alert('Неверный логин или пароль.');
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
