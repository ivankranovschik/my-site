```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мирополис | Вход</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#0f172a,#1e293b,#334155,#0f172a);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.login-box{
    width:420px;
    padding:40px;
    border-radius:24px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    color:white;
    font-size:46px;
    margin-bottom:8px;
}

.logo p{
    color:#cbd5e1;
}

label{
    display:block;
    color:white;
    margin-bottom:8px;
    margin-top:15px;
    font-weight:600;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#cbd5e1;
}

input:focus{
    outline:none;
    background:rgba(255,255,255,0.18);
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#f59e0b;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#d97706;
    transform:translateY(-2px);
}

#error{
    margin-top:15px;
    text-align:center;
    color:#ffb4b4;
}

.footer{
    text-align:center;
    color:#94a3b8;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>🏗 Мирополис</h1>
        <p>Панель управления строителей</p>
    </div>

    <label>Имя пользователя</label>
    <input type="text" id="login" placeholder="Введите логин">

    <label>Пароль</label>
    <input type="password" id="password" placeholder="Введите пароль">

    <button onclick="login()">
        Войти
    </button>

    <div id="error"></div>

    <div class="footer">
        Мирополис © 2026
    </div>

</div>

<script>

function login(){

    let login = document.getElementById("login").value;
    let password = document.getElementById("password").value;

    if(login === "admin" && password === "12345"){
        alert("Добро пожаловать!");
    }else{
        document.getElementById("error").innerText =
        "Неверный логин или пароль";
    }

}

</script>

</body>
</html>
```
