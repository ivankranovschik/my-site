<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Case Upgrader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎮 CASE UPGRADER</h1>

    <div class="balance">
      💰 <span id="balance">5000</span> ₽
    </div>
  </header>


  <nav>
    <button onclick="showPage('cases')">
      🎁 Кейсы
    </button>

    <button onclick="showPage('inventory')">
      🎒 Инвентарь
    </button>

    <button onclick="showPage('upgrade')">
      ⬆️ Апгрейдер
    </button>
  </nav>


  <main>


    <!-- КЕЙСЫ -->

    <section id="cases" class="page active">

      <h2>🎁 Кейсы</h2>

      <div class="cases">

        <div class="case">

          <div class="case-image">📦</div>

          <h3>Обычный кейс</h3>

          <p>Цена: 500 ₽</p>

          <button onclick="openCase(500, 'normal')">
            Открыть
          </button>

        </div>


        <div class="case">

          <div class="case-image">💎</div>

          <h3>Редкий кейс</h3>

          <p>Цена: 1000 ₽</p>

          <button onclick="openCase(1000, 'rare')">
            Открыть
          </button>

        </div>


        <div class="case">

          <div class="case-image">🔥</div>

          <h3>Эпический кейс</h3>

          <p>Цена: 2000 ₽</p>

          <button onclick="openCase(2000, 'epic')">
            Открыть
          </button>

        </div>

      </div>


      <div id="result"></div>

    </section>



    <!-- ИНВЕНТАРЬ -->

    <section id="inventory" class="page">

      <h2>🎒 Инвентарь</h2>

      <div id="inventoryList"></div>

    </section>



    <!-- АПГРЕЙДЕР -->

    <section id="upgrade" class="page">

      <h2>⬆️ Апгрейдер</h2>

      <p class="info">
        Выбери предмет из инвентаря
      </p>


      <div class="upgrade-box">

        <div>

          <h3>Твой предмет</h3>

          <div id="selectedItem" class="selected">
            Ничего не выбрано
          </div>

        </div>


        <div class="arrow">
          ⬆️
        </div>


        <div>

          <h3>Новый предмет</h3>

          <div id="targetItem" class="selected">
            Выбери предмет
          </div>

        </div>

      </div>


      <div class="chance">

        Шанс:
        <strong id="chance">0%</strong>

      </div>


      <button
        class="upgrade-button"
        onclick="upgradeItem()"
      >

        УЛУЧШИТЬ

      </button>


      <p id="upgradeResult"></p>

    </section>


  </main>


  <script src="script.js"></script>

</body>
</html>
