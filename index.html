<!DOCTYPE html>
<html>
<head>

    <title>Лифтёр</title>

</head>
<body>

<h1>Симулятор лифтёра</h1>

<div id="panel">

    <button onclick="goToFloor(16)">16 этаж</button>
</div>

<div id="lift">
    Лифт
</div>

<p id="floorText">Этаж: 1</p>

<script src="script.js"></script>

</body>
</html>
