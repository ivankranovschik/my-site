<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Города Проекта | Мирополис</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель навигации (шапка) -->
    <header class="main-header">
        <div class="logo">Мирополис <span class="logo-badge">CITIES</span></div>
        <nav class="nav-links">
            <a href="main.html" class="back-link">← Вернуться в меню</a>
        </nav>
        <button class="logout-btn" onclick="window.location.href='index.html'">Выйти</button>
    </header>

    <!-- Главный блок с контентом городов -->
    <main class="main-container">
        <div class="dashboard-wrapper">
            <section class="welcome-banner">
                <h1>Города Мирополиса</h1>
                <p>Текущие статусы застройки и планирования объектов на сервере.</p>
            </section>

            <!-- Сетка твоих городов с новыми статусами -->
            <div class="features-grid">
                <!-- 1. Рубайск -->
                <div class="feature-card city-card">
                    <div class="card-icon">👑</div>
                    <h3>Рубайск</h3>
                    <div class="city-info">
                        <span>Статус: <strong class="status-active">Строится</strong></span>
                    </div>
                    <button class="card-btn">Открыть чертежи</button>
                </div>

                <!-- 2. Минск -->
                <div class="feature-card city-card">
                    <div class="card-icon">🏙️</div>
                    <h3>Минск</h3>
                    <div class="city-info">
                        <span>Статус: <strong class="status-discuss">Обсуждения</strong></span>
                    </div>
                    <button class="card-btn">Открыть чертежи</button>
                </div>

                <!-- 3. Североморск -->
                <div class="feature-card city-card">
                    <div class="card-icon">⚓</div>
                    <h3>Североморск</h3>
                    <div class="city-info">
                        <span>Статус: <strong class="status-planned">В планах</strong></span>
                    </div>
                    <button class="card-btn">Открыть чертежи</button>
                </div>

                <!-- 4. Егоровск -->
                <div class="feature-card city-card">
                    <div class="card-icon">🏡</div>
                    <h3>Егоровск</h3>
                    <div class="city-info">
                        <span>Статус: <strong class="status-waiting">Ожидается</strong></span>
                    </div>
                    <button class="card-btn">Открыть чертежи</button>
                </div>

                <!-- 5. Магистральск -->
                <div class="feature-card city-card">
                    <div class="card-icon">🚂</div>
                    <h3>Магистральск</h3>
                    <div class="city-info">
                        <span>Статус: <strong class="status-active">Строится</strong></span>
                    </div>
                    <button class="card-btn">Открыть чертежи</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
